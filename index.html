    { title: '消えた麦わら帽子', text: '村の農家の物干しから、麦わら帽子が消えた。', job: '農家', m: [6, 7, 8], g: '帽子' },
    { title: '消えた赤い傘', text: '村の郵便屋の傘立てから、赤い傘が消えた。', job: '郵便屋', m: [6, 7, 9] },
    { title: '消えた編みかけのマフラー', text: '村の仕立て屋の店先から、編みかけのマフラーが消えた。', job: '仕立て屋', m: [11, 12, 1, 2] },
    { title: '消えた食パンの耳', text: '村のパン屋から、ラスクにするはずだった食パンの耳が消えた。', job: 'パン屋' },
    { title: '消えた投網', text: '村の漁師小屋に干していた投網が、ひと晩で消えた。', job: '漁師' },
    { title: '反対向きの道しるべ', text: '村はずれの道しるべが、反対向きに立て直されていた。', g: 'さかさま' },
    { title: '止められた時計', text: '村の時計屋の飾り窓の時計が、全部同じ時刻で止められていた。', job: '時計屋', g: '時計' },
  ];
  const ALL_YEAR = [];
  STORIES.forEach((s, i) => { if (!s.m) ALL_YEAR.push(i); });

  /* ===================== 証言の種類 ===================== */
  const TYPES = ['LIAR', 'HONEST', 'CULPRIT', 'NOTCULPRIT', 'CULPRIT_LIAR', 'CULPRIT_HONEST',
    'SAME', 'DIFF', 'CULPRIT_IN', 'ATLEAST1LIAR', 'HONESTCOUNT'];
  const PAIR_TYPES = { SAME: 1, DIFF: 1, CULPRIT_IN: 1, ATLEAST1LIAR: 1 };

  // 言い回しの本体（{a}{b}=人名, {k}=人数, {n}=容疑者の人数）と語尾の種類。SELF は話し手自身が入る形（{b}=相手）
  // 語尾は話し手の style で付ける（ENDINGS）
  const TPL = {
    LIAR: [['{a}は嘘つき', 'N']],
    HONEST: [['{a}は正直者', 'N']],
    CULPRIT: [['犯人は{a}', 'N'], ['やったのは{a}', 'N'], ['{a}が犯人', 'N']],
    CULPRIT_SELF: [['犯人はわたし', 'N'], ['やったのはわたし', 'N']],
    NOTCULPRIT: [['{a}は犯人じゃない', 'V'], ['{a}はやってない', 'V']],
    NOTCULPRIT_SELF: [['わたしは犯人じゃない', 'V'], ['わたしはやってない', 'V']],
    CULPRIT_LIAR: [['犯人は嘘つき', 'N'], ['やったのは嘘つき', 'N']],
    CULPRIT_HONEST: [['犯人は正直者', 'N'], ['やったのは正直者', 'N']],
    SAME: [['{a}と{b}は同じ側', 'N'], ['{a}と{b}は、2人とも正直者か、2人とも嘘つき', 'N']],
    SAME_SELF: [['わたしと{b}は同じ側', 'N'], ['わたしと{b}は、2人とも正直者か、2人とも嘘つき', 'N']],
    DIFF: [['{a}と{b}は違う側', 'N'], ['{a}と{b}は、片方が正直者で片方が嘘つき', 'N']],
    DIFF_SELF: [['わたしと{b}は違う側', 'N'], ['わたしと{b}は、片方が正直者で片方が嘘つき', 'N']],
    CULPRIT_IN: [['犯人は{a}か{b}のどちらか', 'N'], ['{a}か{b}、どちらかが犯人', 'N']],
    CULPRIT_IN_SELF: [['犯人はわたしか{b}のどちらか', 'N'], ['わたしか{b}、どちらかが犯人', 'N']],
    ATLEAST1LIAR: [['{a}と{b}のうち、少なくとも1人は嘘つき', 'N'], ['{a}と{b}が2人とも正直者ってことはない', 'V']],
    HONESTCOUNT: [['わたしたち{n}人のうち、正直者はちょうど{k}人', 'N'], ['わたしも入れて数えると、正直者はちょうど{k}人', 'N']],
  };

  // 難易度ごとの種類の重み（その★で使える種類だけ）
  const WEIGHTS = {
    1: { LIAR: 4, HONEST: 3, CULPRIT: 2, NOTCULPRIT: 2, SAME: 1, DIFF: 1 },
    2: { LIAR: 3, HONEST: 2, CULPRIT: 1.5, NOTCULPRIT: 1.5, CULPRIT_LIAR: 1.2, CULPRIT_HONEST: 1.2, SAME: 1.2, DIFF: 1.2, CULPRIT_IN: 1.5 },
    3: { LIAR: 2.5, HONEST: 1.5, CULPRIT: 1, NOTCULPRIT: 1, CULPRIT_LIAR: 1, CULPRIT_HONEST: 1, SAME: 1, DIFF: 1, CULPRIT_IN: 1.2, ATLEAST1LIAR: 1.5, HONESTCOUNT: 1 },
  };

  // 証言の中身が真になる条件（h=正直者のビット, c=犯人）
  function truthOf(type, a, b, k, h, c) {
    switch (type) {
      case 'LIAR': return !((h >> a) & 1);
      case 'HONEST': return !!((h >> a) & 1);
      case 'CULPRIT': return c === a;
      case 'NOTCULPRIT': return c !== a;
      case 'CULPRIT_LIAR': return !((h >> c) & 1);
      case 'CULPRIT_HONEST': return !!((h >> c) & 1);
      case 'SAME': return ((h >> a) & 1) === ((h >> b) & 1);
      case 'DIFF': return ((h >> a) & 1) !== ((h >> b) & 1);
      case 'CULPRIT_IN': return c === a || c === b;
      case 'ATLEAST1LIAR': return !((h >> a) & 1) || !((h >> b) & 1);
      case 'HONESTCOUNT': return popcount(h) === k;
    }
    return false;
  }

  // その★・話し手で使ってよい証言か
  function allowedFor(type, a, b, s, star) {
    switch (type) {
      case 'LIAR': case 'HONEST': return a !== s;
      case 'CULPRIT': case 'NOTCULPRIT': return true;
      case 'CULPRIT_LIAR': case 'CULPRIT_HONEST': case 'CULPRIT_IN': return star >= 2;
      case 'SAME': case 'DIFF': return (a === s || b === s) ? star >= 2 : true;
      case 'ATLEAST1LIAR': return star >= 3 && a !== s && b !== s;
      case 'HONESTCOUNT': return star >= 3;
    }
    return false;
  }
  const keyOf = (type, a, b, k) => type + ':' + (a == null ? -1 : a) + ':' + (b == null ? -1 : b) + ':' + (k == null ? -1 : k);
  // 「わたしとXは同じ側／違う側」（話し手が何者でも X だけが決まる形）
  const isSelfPair = (ct, s) => (ct.type === 'SAME' || ct.type === 'DIFF') && (ct.a === s || ct.b === s);

  /* ===================== 全世界の表（人数ごとに1回だけ作る） =====================
   * 世界 = (正直者マスク h, 犯人 c)。集合は「犯人ごとのブロック × hのビット列」で持つ。
   * 1ブロックは 2^N ビットを 32bit の語 K 個に分けた配列。N≤5 は1語、6人は2語、7人は4語、8人は8語、9人は16語。
   * 9人で 2^9 × 9 = 4608 通り。
   */
  const CTX = {};
  function ctxFor(N) {
    if (CTX[N]) return CTX[N];
    const HN = 1 << N;
    const K = Math.max(1, HN >> 5);
    const valid = [];
    for (let j = 0; j < K; j++) {
      const nb = Math.min(32, HN - 32 * j);
      valid.push(nb >= 32 ? -1 : ((1 << nb) - 1));
    }
    const HP = [];
    for (let p = 0; p < N; p++) {
      const row = [];
      for (let j = 0; j < K; j++) {
        let m = 0;
        for (let bit = 0; bit < 32; bit++) {
          const h = 32 * j + bit;
          if (h < HN && ((h >> p) & 1)) m |= 1 << bit;
        }
        row.push(m);
      }
      HP.push(row);
    }
    const contents = [];
    const byKey = {};
    const add = (type, a, b, k) => {
      const T = new Int32Array(N * K);
      for (let c = 0; c < N; c++) for (let h = 0; h < HN; h++) {
        if (truthOf(type, a, b, k, h, c)) T[c * K + (h >> 5)] |= 1 << (h & 31);
      }
      const id = contents.length;
      const ct = { id, type, a, b, k, T };
      contents.push(ct);
      byKey[keyOf(type, a, b, k)] = ct;
    };
    for (let x = 0; x < N; x++) { add('LIAR', x, null, null); add('HONEST', x, null, null); add('CULPRIT', x, null, null); add('NOTCULPRIT', x, null, null); }
    add('CULPRIT_LIAR', null, null, null); add('CULPRIT_HONEST', null, null, null);
    for (let x = 0; x < N; x++) for (let y = x + 1; y < N; y++) {
      add('SAME', x, y, null); add('DIFF', x, y, null); add('CULPRIT_IN', x, y, null); add('ATLEAST1LIAR', x, y, null);
    }
    for (let k = 1; k < N; k++) add('HONESTCOUNT', null, null, k);
    const ctx = { N, K, HN, valid, HP, contents, byKey, cons: {}, pools: {} };
    CTX[N] = ctx;
    return ctx;
  }

  // 話し手 s の「正直なら真・嘘つきなら偽」になる世界の集合
  function consOf(ctx, ct, s) {
    const key = ct.id * 16 + s;
    let C = ctx.cons[key];
    if (C) return C;
    const { N, K, HP, valid } = ctx;
    C = new Int32Array(N * K);
    for (let c = 0; c < N; c++) for (let j = 0; j < K; j++) {
      const t = ct.T[c * K + j], m = HP[s][j];
      C[c * K + j] = ((t & m) | (~t & ~m)) & valid[j];
    }
    ctx.cons[key] = C;
    return C;
  }

  // ★・話し手ごとの使える証言（種類別）
  function poolFor(ctx, star, s) {
    const key = star * 16 + s;
    if (ctx.pools[key]) return ctx.pools[key];
    const byType = {};
    for (const ct of ctx.contents) {
      if (!allowedFor(ct.type, ct.a, ct.b, s, star)) continue;
      (byType[ct.type] = byType[ct.type] || []).push(ct);
    }
    ctx.pools[key] = byType;
    return byType;
  }

  /* ===================== 推論の中身 ===================== */
  // P = { N, K, ctx, chainMax, stmts:[{s, type, a, b, k, T, C}], given:{p, v(1=H,2=L)}|null }
  // 事実（各人の正直/嘘つき）に合う h の集合（K 語）
  function computeHS(P, st) {
    const { K, ctx } = P;
    const hs = new Int32Array(K);
    for (let j = 0; j < K; j++) hs[j] = ctx.valid[j];
    for (let p = 0; p < P.N; p++) {
      const v = st[p];
      if (v !== 1 && v !== 2) continue;
      const row = ctx.HP[p];
      if (v === 1) for (let j = 0; j < K; j++) hs[j] &= row[j];
      else for (let j = 0; j < K; j++) hs[j] &= ~row[j];
    }
    return hs;
  }

  // 事実＋1つの証言で残る世界を作り、そこから決まることを取り出す。空なら null（矛盾）
  function evalC(P, C, hs, st, cand) {
    const { N, K, ctx } = P;
    const u = ctx.tmpU || (ctx.tmpU = new Int32Array(K)); // 作業用（呼び出しをまたいで値を残さない）
    u.fill(0);
    let cs = 0;
    for (let c = 0; c < N; c++) {
      if (!((cand >> c) & 1)) continue;
      const base = c * K;
      let any = 0;
      for (let j = 0; j < K; j++) { const w = hs[j] & C[base + j]; u[j] |= w; any |= w; }
      if (any) cs |= 1 << c;
    }
    if (!cs) return null;
    let fH = 0, fL = 0;
    for (let p = 0; p < N; p++) {
      if (st[p] !== 0) continue;
      const row = ctx.HP[p];
      let canH = 0, canL = 0;
      for (let j = 0; j < K; j++) { canH |= u[j] & row[j]; canL |= u[j] & ~row[j]; }
      if (!canH) fL |= 1 << p; else if (!canL) fH |= 1 << p;
    }
    return { fH, fL, cand: cs };
  }

  // 事実だけで証言の中身の真偽が決まるか: 1=本当, 0=ウソ, -1=決まらない
  function truthDet(P, T, hs, cand) {
    const { N, K } = P;
    let anyT = false, anyF = false;
    for (let c = 0; c < N; c++) {
      if (!((cand >> c) & 1)) continue;
      for (let j = 0; j < K; j++) {
        const t = T[c * K + j];
        if (hs[j] & t) anyT = true;
        if (hs[j] & ~t) anyF = true;
      }
    }
    if (anyT && anyF) return -1;
    return anyT ? 1 : 0;
  }

  /* 直接の推論を1つ探す。優先: A(話し手が既知) → B(真偽が決まり話し手がわかる) → C(場合分け) → Wk(犯人候補の部分的な絞り込みだけのA)
   * ・「犯人は嘘つきだ」を話し手が未確定のまま使い「話し手は犯人ではない」とだけ決める手（自己言及のひっかけ）は直接の推論にしない。
   *   必要なときは仮定「もし犯人が〇〇だとすると」で扱う。
   * ・inHypo（仮定の中）では C（1証言内の場合分け）を使わない。仮定の中にもう一段の場合分けを入れないため。 */
  function scan(P, st, cand, inHypo) {
    const hs = computeHS(P, st);
    let contra = -1, A = null, B = null, Cs = null, Wk = null;
    const M = P.stmts.length;
    for (let i = 0; i < M; i++) {
      const S = P.stmts[i];
      const r = evalC(P, S.C, hs, st, cand);
      if (r === null) { if (contra < 0) contra = i; continue; }
      if (!(r.fH | r.fL) && r.cand === cand) continue;
      if (st[S.s] !== 0) {
        const weak = !(r.fH | r.fL) && popcount(r.cand) > 1 && (S.type === 'CULPRIT_LIAR' || S.type === 'CULPRIT_HONEST');
        if (weak) { if (!Wk) Wk = { i, cat: 'A', r }; }
        else if (!A) A = { i, cat: 'A', r };
      } else {
        const det = truthDet(P, S.T, hs, cand);
        if (det >= 0) { if (!B) B = { i, cat: 'B', r, truth: det }; }
        else if (inHypo) continue;
        else if (S.type === 'CULPRIT_LIAR' && !(r.fH | r.fL)) continue;
        else if (!Cs) Cs = { i, cat: 'C', r };
      }
    }
    return { contra, step: A || B || Cs || Wk };
  }

  function isDone(P, st, cand) {
    for (let p = 0; p < P.N; p++) if (st[p] === 0) return false;
    return popcount(cand) === 1;
  }
  function recordDirect(P, found, st, cand) {
    const rec = {
      kind: 'direct', source: found.i, cat: found.cat, truth: found.truth,
      st0: Array.from(st), cand0: cand, fH: found.r.fH, fL: found.r.fL, cand1: found.r.cand,
    };
    if (found.cat === 'C') {
      // 場合分けの中身（話し手が正直者のとき／嘘つきのとき）
      const S = P.stmts[found.i];
      rec.br = {};
      for (const v of [1, 2]) {
        const st1 = Int8Array.from(st); st1[S.s] = v;
        const r = evalC(P, S.C, computeHS(P, st1), st1, cand);
        rec.br[v] = r ? { fH: r.fH, fL: r.fL, cand: r.cand } : null;
      }
    }
    return rec;
  }
  function applyFacts(st, fH, fL, N) {
    for (let p = 0; p < N; p++) {
      if ((fH >> p) & 1) st[p] = 1;
      if ((fL >> p) & 1) st[p] = 2;
    }
  }

  const CHAIN_MAX = 10;

  /* 7〜9人（難問）の設定。3〜6人の作り方には使わない（3〜6人は今までと1文字も変わらない問題を作る）。
   * chainMax = 仮定の連鎖の上限（中の手の数＋矛盾の1手）、
   * hypsMax = 仮定の回数の上限、sumMin = 仮定の手の合計の下限（band 'hard'）、lines = 解説の行数の上限（仮定は見出し・中の手・矛盾・結論を1行ずつ）、
   * minTypes = 証言の種類の数の下限、typeCap = 同じ種類の証言の数の上限、attempts = 候補を作る回数の上限、climb = 解を1つにする山登りの回数 */
  const LIMITS = { minPeople: 3, maxPeople: 9, hardFrom: 7, hardStar: 3 };
  const HARD_FROM = LIMITS.hardFrom;
  const HARD = {
    7: { chainMax: 10, hypsMax: 3, sumMin: 7, lines: 22, minTypes: 4, typeCap: 2, attempts: 600, climb: 60 },
    8: { chainMax: 11, hypsMax: 4, sumMin: 7, lines: 24, minTypes: 5, typeCap: 3, attempts: 600, climb: 70 },
    9: { chainMax: 12, hypsMax: 4, sumMin: 8, lines: 26, minTypes: 5, typeCap: 3, attempts: 600, climb: 80 },
  };

  function tryHypo(P, st, cand, hy, maxLen) {
    const N = P.N;
    const st2 = Int8Array.from(st);
    let cand2 = cand;
    if (hy.kind === 'status') st2[hy.p] = hy.v; else cand2 = 1 << hy.p;
    const sub = [];
    let used = 0;
    for (let guard = 0; guard < 40; guard++) {
      const r = scan(P, st2, cand2, true);
      if (r.contra >= 0) {
        const len = sub.length + 1;
        if (len > maxLen) return null;
        return { hy, sub, len, contra: r.contra, cst: Array.from(st2), ccand: cand2, used: used | (1 << r.contra) };
      }
      if (!r.step) return null;
      if (sub.length + 2 > maxLen) return null;
      sub.push(recordDirect(P, r.step, st2, cand2));
      used |= 1 << r.step.i;
      applyFacts(st2, r.step.r.fH, r.step.r.fL, N);
      cand2 = r.step.r.cand;
    }
    return null;
  }

  // 仮定を1つ置いて矛盾を探す。まず人の正直/嘘つきの仮定（連鎖が最短のもの。同点はカード順・H→L）、
  // それが1つも成り立たないときだけ犯人の仮定（連鎖が最短のもの。同点はカード順）
  function findHypo(P, st, cand) {
    const N = P.N;
    let best = null;
    for (let p = 0; p < N; p++) {
      if (st[p] !== 0) continue;
      for (const v of [1, 2]) {
        const r = tryHypo(P, st, cand, { kind: 'status', p, v }, best ? best.len - 1 : P.chainMax);
        if (r) best = r;
      }
    }
    if (best) return best;
    if (popcount(cand) > 1) {
      for (let c = 0; c < N; c++) {
        if (!((cand >> c) & 1)) continue;
        const r = tryHypo(P, st, cand, { kind: 'culprit', p: c }, best ? best.len - 1 : P.chainMax);
        if (r) best = r;
      }
    }
    return best;
  }

  function solveCore(P, maxHyps) {
    if (maxHyps == null) maxHyps = 99;
    const N = P.N;
    const st = new Int8Array(N);
    let cand = (1 << N) - 1;
    const steps = [];
    let hyps = 0, chain = 0, sum = 0, back = 0, used = 0;
    if (P.given) {
      const g = P.given;
      steps.push({ kind: 'direct', source: 'given', cat: 'G', st0: Array.from(st), cand0: cand,
        fH: g.v === 1 ? 1 << g.p : 0, fL: g.v === 2 ? 1 << g.p : 0, cand1: cand });
      st[g.p] = g.v;
    }
    const out = (solved) => ({ solved, steps, hyps, chain, sum, back, used, st, cand });
    for (let guard = 0; guard < 80; guard++) {
      if (isDone(P, st, cand)) return out(true);
      const r = scan(P, st, cand, false);
      if (r.contra >= 0) break; // 本来起きない（推論が正しければ）
      if (r.step) {
        steps.push(recordDirect(P, r.step, st, cand));
        if (r.step.cat === 'B') back++;
        used |= 1 << r.step.i;
        applyFacts(st, r.step.r.fH, r.step.r.fL, N);
        cand = r.step.r.cand;
        continue;
      }
      if (hyps >= maxHyps) break;
      const h = findHypo(P, st, cand);
      if (!h) break;
      hyps++;
      sum += h.len;
      if (h.len > chain) chain = h.len;
      used |= h.used;
      const rec = { kind: 'hypo', hy: h.hy, sub: h.sub, len: h.len, contra: h.contra, cst: h.cst, ccand: h.ccand,
        st0: Array.from(st), cand0: cand, fH: 0, fL: 0, cand1: cand };
      if (h.hy.kind === 'status') {
        if (h.hy.v === 1) rec.fL = 1 << h.hy.p; else rec.fH = 1 << h.hy.p;
        st[h.hy.p] = h.hy.v === 1 ? 2 : 1;
      } else {
        cand &= ~(1 << h.hy.p);
        rec.cand1 = cand;
      }
      steps.push(rec);
    }
    return out(false);
  }

  function starOf(hyps, chain) {
    if (hyps === 0) return 1;
    if (hyps === 1 && chain <= 4) return 2;
    return 3;
  }

  /* 同じ★の中の難しさの幅（band）。m = { hyps, chain, sum, back, given }
   * 生成は「目標の★」かつ「band に入る」問題を探す。見つからなければ最も近いものを使う（★の一致を優先）。 */
  const BANDS = {
    star3: (m) => m.hyps <= 3 && (m.chain >= 5 || m.sum >= 5),        // ★3 の既定: やさしすぎ・重すぎを外す
    mon: null,                                                          // 月 ★1・4人
    tue: (m) => m.back >= 3,                                            // 火 ★1・5人: 逆向きの推理が3回以上
    wed: (m) => m.chain <= 3 && m.given,                                // 水 ★2・4人: 連鎖3以下・村長のメモあり
    thu: (m) => m.chain === 3,                                          // 木 ★2・5人: 連鎖3
    fri: (m) => m.chain >= 3,                                           // 金 ★2・6人: 連鎖3〜4
    sat: (m) => m.hyps === 2 && m.sum >= 5 && m.sum <= 6,               // 土 ★3・5人: 仮定2回・合計5〜6
    sun: (m) => m.hyps <= 3 && (m.chain >= 5 || m.sum >= 7),            // 日 ★3・6人: 合計7以上か連鎖5以上・仮定3回以下
    hard: (m) => m.hyps >= 2 && m.sum >= (HARD[m.n] || HARD[HARD_FROM]).sumMin, // 7〜9人の難問: 仮定2回以上・合計が人数ごとの下限以上
  };
  const BAND_GIVEN = { wed: true };
  const DEFAULT_BAND = { 3: 'star3' };

  /* ===================== 文章 ===================== */
  const SW = ['', '正直者', '嘘つき'];
  const COMPLEX = { CULPRIT_LIAR: 1, CULPRIT_HONEST: 1, SAME: 1, DIFF: 1, CULPRIT_IN: 1, ATLEAST1LIAR: 1, HONESTCOUNT: 1 };
  const CULPRIT_TYPES = { CULPRIT: 1, NOTCULPRIT: 1, CULPRIT_IN: 1, CULPRIT_LIAR: 1, CULPRIT_HONEST: 1 };

  function makeWriter(names, stmts, N) {
    const nm = (p) => names[p];
    const listAnd = (ps) => ps.length === 1 ? nm(ps[0]) : ps.length === 2 ? nm(ps[0]) + 'と' + nm(ps[1]) : ps.map(nm).join('・');
    const listOr = (ps) => ps.length === 1 ? nm(ps[0]) : ps.length === 2 ? nm(ps[0]) + 'か' + nm(ps[1]) : ps.map(nm).join('・') + 'のだれか';
    const both = (n) => (n === 2 ? 'どちらも' : n + '人とも');
    const q = (i) => '『' + stmts[i].text + '』';

    function candPhrase(before, after, exclude) {
      const A = bitsOf(after, N), Rm = bitsOf(before & ~after, N);
      if (A.length === 1) {
        if (exclude && Rm.length >= 1 && Rm.length <= 2) return listAnd(Rm) + 'は犯人ではないので、残る' + nm(A[0]) + 'が犯人';
        return '犯人は' + nm(A[0]);
      }
      if (exclude && Rm.length <= 2) return listAnd(Rm) + 'は犯人ではない' + (A.length <= 3 ? '。犯人は' + listOr(A) : '');
      if (A.length === 2 || A.length < Rm.length) return '犯人は' + listOr(A);
      return listAnd(Rm) + 'は犯人ではない';
    }
    function factsPhrase(fH, fL, cand0, cand1, exclude) {
      const parts = [];
      // 犯人が1人に決まり、その人の正直/嘘つきも決まったときは「犯人はX、Xは〜」の順にする
      const z = (cand1 !== cand0 && popcount(cand1) === 1) ? lowBit(cand1) : -1;
      if (z >= 0) {
        parts.push(candPhrase(cand0, cand1, exclude));
        if ((fH >> z) & 1) { parts.push(nm(z) + 'は正直者'); fH &= ~(1 << z); }
        if ((fL >> z) & 1) { parts.push(nm(z) + 'は嘘つき'); fL &= ~(1 << z); }
      }
      const Hs = bitsOf(fH, N), Ls = bitsOf(fL, N);
      if (Hs.length) parts.push(listAnd(Hs) + 'は正直者');
      if (Ls.length) parts.push(listAnd(Ls) + 'は嘘つき');
      if (z < 0 && cand1 !== cand0) parts.push(candPhrase(cand0, cand1, exclude));
      return parts.join('、');
    }
    function meaning(i, truth) {
      const S = stmts[i];
      const X = S.a != null ? nm(S.a) : '', Y = S.b != null ? nm(S.b) : '';
      switch (S.type) {
        case 'LIAR': return truth ? X + 'は嘘つき' : X + 'は正直者';
        case 'HONEST': return truth ? X + 'は正直者' : X + 'は嘘つき';
        case 'CULPRIT': return truth ? '犯人は' + X : X + 'は犯人ではない';
        case 'NOTCULPRIT': return truth ? X + 'は犯人ではない' : '犯人は' + X;
        case 'CULPRIT_LIAR': return truth ? '犯人は嘘つき' : '犯人は正直者';
        case 'CULPRIT_HONEST': return truth ? '犯人は正直者' : '犯人は嘘つき';
        case 'SAME': return truth ? X + 'と' + Y + 'は同じ側' : X + 'と' + Y + 'は違う側';
        case 'DIFF': return truth ? X + 'と' + Y + 'は違う側' : X + 'と' + Y + 'は同じ側';
        case 'CULPRIT_IN': return truth ? '犯人は' + X + 'か' + Y : X + 'と' + Y + 'は犯人ではない';
        case 'ATLEAST1LIAR': return truth ? X + 'と' + Y + 'の少なくとも1人は嘘つき' : X + 'と' + Y + 'は正直者';
        case 'HONESTCOUNT': return truth ? '正直者はちょうど' + S.k + '人' : '正直者は' + S.k + '人ではない';
      }
      return '';
    }
    // 事実だけで証言の真偽が決まるときの理由。{t, noun}（noun=名詞で終わる→「なので」）
    function reason(i, truth, st, cand) {
      const S = stmts[i];
      const cs = bitsOf(cand, N);
      const known = (p) => st[p] !== 0;
      switch (S.type) {
        case 'LIAR': case 'HONEST':
          if (known(S.a)) return { t: nm(S.a) + 'は' + SW[st[S.a]], noun: true };
          break;
        case 'CULPRIT': case 'NOTCULPRIT':
          if (cs.length === 1 && cs[0] === S.a) return { t: '犯人は' + nm(S.a), noun: true };
          if (!((cand >> S.a) & 1)) return { t: nm(S.a) + 'は犯人ではない', noun: false };
          break;
        case 'CULPRIT_LIAR': case 'CULPRIT_HONEST': {
          if (cs.every(known)) {
            const v = st[cs[0]];
            if (cs.every((p) => st[p] === v)) {
              if (cs.length === 1) return { t: '犯人の' + nm(cs[0]) + 'は' + SW[v], noun: true };
              if (cs.length === N) return { t: '全員が' + SW[v] + 'で、犯人も' + SW[v], noun: true };
              return { t: '犯人の候補の' + listAnd(cs) + 'は' + both(cs.length) + SW[v], noun: true };
            }
          }
          break;
        }
        case 'SAME': case 'DIFF':
          if (known(S.a) && known(S.b)) {
            if (st[S.a] === st[S.b]) return { t: nm(S.a) + 'も' + nm(S.b) + 'も' + SW[st[S.a]], noun: true };
            return { t: nm(S.a) + 'は' + SW[st[S.a]] + '、' + nm(S.b) + 'は' + SW[st[S.b]], noun: true };
          }
          break;
        case 'CULPRIT_IN': {
          const inA = (cand >> S.a) & 1, inB = (cand >> S.b) & 1;
          if (truth) {
            if (cs.length === 1) return { t: '犯人は' + nm(cs[0]), noun: true };
            if (cs.length === 2 && inA && inB) return { t: '犯人は' + nm(S.a) + 'か' + nm(S.b) + 'に絞られている', noun: false };
          } else if (!inA && !inB) {
            return { t: nm(S.a) + 'も' + nm(S.b) + 'も犯人ではない', noun: false };
          }
          break;
        }
        case 'ATLEAST1LIAR':
          if (truth) {
            const l = [S.a, S.b].find((p) => st[p] === 2);
            if (l != null) return { t: nm(l) + 'は嘘つき', noun: true };
          } else if (st[S.a] === 1 && st[S.b] === 1) {
            return { t: nm(S.a) + 'も' + nm(S.b) + 'も正直者', noun: true };
          }
          break;
        case 'HONESTCOUNT': {
          const Hs = [], Ls = [];
          let u = 0;
          for (let p = 0; p < N; p++) { if (st[p] === 1) Hs.push(p); else if (st[p] === 2) Ls.push(p); else u++; }
          if (u === 0) {
            if (Hs.length === 0) return { t: '正直者は1人もいない', noun: false };
            if (Hs.length === 1) return { t: '正直者は' + nm(Hs[0]) + '1人だけ', noun: true };
            return { t: '正直者は' + listAnd(Hs) + 'の' + Hs.length + '人', noun: true };
          }
          if (Hs.length > S.k) return { t: '正直者がすでに' + listAnd(Hs) + 'の' + Hs.length + '人いる', noun: false };
          if (Hs.length + u < S.k) return { t: '嘘つきがすでに' + listAnd(Ls) + 'の' + Ls.length + '人いて、正直者は多くても' + (N - Ls.length) + '人', noun: true };
          break;
        }
      }
      return null;
    }
    const conn = (r) => r.t + (r.noun ? 'なので' : 'ので');
    // 話し手が既知の証言で、他の事実を組み合わせたときの補足
    function support(rec, truth) {
      const S = stmts[rec.source];
      const st = rec.st0;
      const derived = rec.fH | rec.fL;
      switch (S.type) {
        case 'SAME': case 'DIFF': {
          for (const [d, o] of [[S.a, S.b], [S.b, S.a]]) {
            if (((derived >> d) & 1) && o !== S.speaker && st[o] !== 0) return nm(o) + 'は' + SW[st[o]] + 'なので';
          }
          break;
        }
        case 'CULPRIT_LIAR': case 'CULPRIT_HONEST': {
          const rem = bitsOf(rec.cand0 & ~rec.cand1, N);
          if (rem.length) {
            const v = st[rem[0]];
            if (rem.every((p) => st[p] === v && v !== 0)) return (rem.length === 1 && rem[0] === S.speaker ? nm(rem[0]) + '自身も' : listAnd(rem) + 'は') + SW[v] + 'なので';
          }
          const cs = bitsOf(rec.cand0, N);
          if (cs.length === 1 && derived) return '犯人は' + nm(cs[0]) + 'なので';
          break;
        }
        case 'CULPRIT_IN':
          if (truth && popcount(rec.cand1) === 1) {
            const out = [S.a, S.b].filter((p) => !((rec.cand0 >> p) & 1));
            if (out.length === 1) return nm(out[0]) + 'は犯人ではないので';
          }
          break;
        case 'ATLEAST1LIAR':
          if (truth) {
            for (const [d, o] of [[S.a, S.b], [S.b, S.a]]) {
              if (((rec.fL >> d) & 1) && st[o] === 1) return nm(o) + 'は正直者なので';
            }
          }
          break;
        case 'HONESTCOUNT': {
          const Hs = [], Ls = [];
          for (let p = 0; p < N; p++) { if (st[p] === 1) Hs.push(p); else if (st[p] === 2) Ls.push(p); }
          const k = S.k;
          if (truth) {
            if (rec.fL && !rec.fH && Hs.length === k) {
              return k === 1 ? '正直者は' + nm(Hs[0]) + '1人だけなので' : '正直者はもう' + listAnd(Hs) + 'の' + k + '人がそろったので';
            }
            if (rec.fH && !rec.fL && Ls.length === N - k) {
              return '正直者が' + k + '人なら、嘘つきは' + (N - k === 1 ? '1人だけ。それは' + nm(Ls[0]) + 'なので'
                : (N - k) + '人。もう' + listAnd(Ls) + 'の' + (N - k) + '人がそろったので');
            }
          } else {
            const d = bitsOf(derived, N);
            if (d.length === 1) {
              const v = (rec.fH >> d[0]) & 1 ? 1 : 2;
              const bad = 3 - v;
              const hw = Hs.filter((p) => p !== d[0]);
              if (bad === 1) hw.push(d[0]);
              hw.sort((x, y) => x - y);
              if (hw.length === k) {
                return nm(d[0]) + 'が' + SW[bad] + 'だと、正直者は' + (k === 1 ? nm(hw[0]) + '1人だけ' : listAnd(hw) + 'の' + k + '人') + 'になってしまうので';
              }
            }
          }
          break;
        }
      }
      return '';
    }
    const isExclusion = (type, truth) => (type === 'CULPRIT' && !truth) || (type === 'NOTCULPRIT' && truth) || (type === 'CULPRIT_IN' && !truth);

    function directText(rec) {
      if (rec.source === 'given') {
        const p = lowBit(rec.fH | rec.fL);
        return '村長のメモは必ず本当。→ ' + nm(p) + 'は' + SW[(rec.fH >> p) & 1 ? 1 : 2];
      }
      const i = rec.source, S = stmts[i], s = S.speaker;
      if (rec.cat === 'A') {
        const truth = rec.st0[s] === 1;
        const head = nm(s) + 'は' + SW[rec.st0[s]] + 'なので、' + q(i) + 'は' + (truth ? '本当' : 'ウソ') + '。';
        const facts = factsPhrase(rec.fH, rec.fL, rec.cand0, rec.cand1, isExclusion(S.type, truth));
        let mid = '';
        if (!truth && COMPLEX[S.type]) {
          const m = meaning(i, false);
          if (facts.indexOf(m) !== 0) {
            // 「2人とも〜」の形は、結論と同じ名前をくり返さない
            if (S.type === 'ATLEAST1LIAR') mid = 'つまり、2人とも正直者。';
            else if (S.type === 'CULPRIT_IN') mid = 'つまり、2人とも犯人ではない。';
            else mid = 'つまり、' + m + '。';
          }
        }
        const sup = support(rec, truth);
        return head + mid + (sup ? sup + ' ' : '') + '→ ' + facts;
      }
      if (rec.cat === 'B') {
        const truth = rec.truth === 1;
        const r = reason(i, truth, rec.st0, rec.cand0);
        const lead = r ? conn(r) + '、' : 'わかっていることから、';
        return lead + nm(s) + 'の' + q(i) + 'は' + (truth ? '本当' : 'ウソ') + '。→ ' + factsPhrase(rec.fH, rec.fL, rec.cand0, rec.cand1, false);
      }
      // C: 話し手が正直者の場合と嘘つきの場合を両方考える
      if ((rec.fH | rec.fL) >> s & 1) {
        const v = (rec.fH >> s) & 1 ? 1 : 2;
        const rest = factsPhrase(rec.fH & ~(1 << s), rec.fL & ~(1 << s), rec.cand0, rec.cand1, false);
        const bad = v === 1 ? '本当' : 'ウソ';
        const st1 = rec.st0.slice(); st1[s] = 3 - v;
        const r = reason(i, v === 1, st1, rec.cand0);
        const why = r ? conn(r) + '、' : '';
        let tail = '';
        if (rest) {
          const st2 = rec.st0.slice(); st2[s] = v;
          const sup = support({ source: i, st0: st2, cand0: rec.cand0, cand1: rec.cand1, fH: rec.fH & ~(1 << s), fL: rec.fL & ~(1 << s) }, v === 1);
          tail = '。\n' + nm(s) + 'は' + SW[v] + 'なので、' + q(i) + 'は' + (v === 1 ? '本当' : 'ウソ') + '。' + (sup ? sup + ' ' : '') + '→ ' + rest;
        }
        return nm(s) + 'が' + SW[3 - v] + 'だとすると、' + why + q(i) + 'が' + bad + 'になってしまい、合わない。だから、' + nm(s) + 'は' + SW[v] + tail;
      }
      const facts = factsPhrase(rec.fH, rec.fL, rec.cand0, rec.cand1, false);
      if ((S.type === 'SAME' || S.type === 'DIFF') && (S.a === s || S.b === s) && rec.cand0 === rec.cand1) {
        const o = S.a === s ? S.b : S.a;
        const want = S.type === 'SAME' ? 1 : 2;
        if (rec.fH === (want === 1 ? 1 << o : 0) && rec.fL === (want === 2 ? 1 << o : 0)) {
          return nm(s) + 'は' + q(i) + 'と言っている。' + nm(s) + 'が正直者なら本当なので、' + nm(o) + (want === 1 ? 'も正直者' : 'は嘘つき') + '。' +
            nm(s) + 'が嘘つきならウソなので、' + nm(o) + 'は' + nm(s) + 'と' + (want === 1 ? '違う側、つまり正直者' : '同じ側、つまり嘘つき') + '。どちらにしても → ' + facts;
        }
      }
      if (rec.br && rec.br[1] && rec.br[2]) {
        const part = (v) => {
          const b = rec.br[v];
          const st2 = rec.st0.slice(); st2[s] = v;
          const pr = { source: i, st0: st2, cand0: rec.cand0, cand1: b.cand, fH: b.fH, fL: b.fL };
          const sup = support(pr, v === 1);
          const f = factsPhrase(b.fH, b.fL, rec.cand0, b.cand, isExclusion(S.type, v === 1));
          return (sup ? sup + '、' : '') + f;
        };
        return nm(s) + 'が正直者か嘘つきかで分けて考える。\n・正直者なら' + q(i) + 'は本当で、' + part(1) + '。\n・嘘つきならウソで、' + part(2) + '。\nどちらにしても → ' + facts;
      }
      return nm(s) + 'が正直者なら' + q(i) + 'は本当、嘘つきならウソ。どちらの場合でも → ' + facts;
    }

    function contraText(i, st, cand) {
      const S = stmts[i], s = S.speaker;
      if (st[s] !== 0) {
        const need = st[s] === 1;
        const r = reason(i, !need, st, cand);
        if (r) return 'ところが、' + nm(s) + 'は' + SW[st[s]] + 'なので' + q(i) + 'は' + (need ? '本当' : 'ウソ') + 'のはず。でも' + conn(r) + '、' + (need ? 'ウソ' : '本当') + 'になってしまう。';
        return 'ところが、' + nm(s) + 'の' + q(i) + 'と食い違う。';
      }
      // 自己言及: 犯人が話し手本人なら「犯人は嘘つきだ」は「わたしは嘘つきだ」と同じ
      if (S.type === 'CULPRIT_LIAR' && cand === (1 << s)) {
        return 'ところが、犯人が' + nm(s) + 'なら、' + nm(s) + 'の' + q(i) + 'は「わたしは嘘つきだ」と言っているのと同じ。正直者ならウソに、嘘つきなら本当になってしまうので、だれにも言えない。';
      }
      // 話し手が未確定: 正直者でも嘘つきでも合わない
      const why = (v, truth) => {
        const st1 = st.slice(); st1[s] = v;
        const r = reason(i, truth, st1, cand);
        return r ? conn(r) : '';
      };
      const wH = why(1, false), wL = why(2, true);
      return 'ところが、' + nm(s) + 'が正直者だと' + (wH ? wH + '、' : '') + q(i) + 'はウソ。嘘つきだと' + (wL ? wL + '、' : '') +
        '本当になってしまう。どちらでも合わない。';
    }
    function hypoHead(hy) {
      if (hy.kind === 'status') return 'もし' + nm(hy.p) + 'が' + SW[hy.v] + 'だとすると……';
      return 'もし犯人が' + nm(hy.p) + 'だとすると……';
    }
    function hypoConclusion(rec) {
      const hy = rec.hy;
      if (hy.kind === 'status') return 'だから、' + nm(hy.p) + 'は' + SW[3 - hy.v];
      const left = bitsOf(rec.cand1, N);
      return 'だから、' + nm(hy.p) + 'は犯人ではない' + (left.length === 1 ? '。残る' + nm(left[0]) + 'が犯人' : '');
    }
    return { nm, listAnd, listOr, meaning, reason, conn, directText, contraText, hypoHead, hypoConclusion, q };
  }

  function factsOut(rec, N) {
    const out = [];
    for (let p = 0; p < N; p++) {
      if ((rec.fH >> p) & 1) out.push({ kind: 'status', person: p, value: 'H' });
      if ((rec.fL >> p) & 1) out.push({ kind: 'status', person: p, value: 'L' });
    }
    if (rec.cand1 !== rec.cand0) out.push({ kind: 'culprit', cand: bitsOf(rec.cand1, N) });
    return out;
  }

  function renderSteps(raw, W, N) {
    const direct = (rec) => ({ kind: 'direct', source: rec.source, cat: rec.cat, text: W.directText(rec), facts: factsOut(rec, N) });
    return raw.map((rec) => {
      if (rec.kind === 'direct') return direct(rec);
      const hy = rec.hy;
      return {
        kind: 'hypo',
        assume: hy.kind === 'status' ? { kind: 'status', person: hy.p, value: hy.v === 1 ? 'H' : 'L' } : { kind: 'culprit', person: hy.p },
        text: W.hypoHead(hy),
        sub: rec.sub.map(direct),
        contradiction: W.contraText(rec.contra, rec.cst, rec.ccand),
        contraSource: rec.contra,
        conclusion: W.hypoConclusion(rec),
        chain: rec.len,
        facts: factsOut(rec, N),
      };
    });
  }

  /* ===================== 問題の組み立て ===================== */
  function makeP(ctx, cts, speakers, given) {
    return {
      N: ctx.N, K: ctx.K, ctx, chainMax: ctx.N >= HARD_FROM ? HARD[ctx.N].chainMax : CHAIN_MAX,
      stmts: cts.map((ct, i) => ({ s: speakers[i], type: ct.type, a: ct.a, b: ct.b, k: ct.k, T: ct.T, C: consOf(ctx, ct, speakers[i]) })),
      given,
    };
  }
  function pFromPuzzle(pz) {
    const N = pz.people;
    const ctx = ctxFor(N);
    const cts = pz.statements.map((s) => {
      const ct = ctx.byKey[keyOf(s.type, s.a, s.b, s.k)];
      if (!ct) throw new Error('unknown statement');
      return ct;
    });
    const given = pz.given ? { p: pz.given.person, v: pz.given.value === 'H' ? 1 : 2 } : null;
    return makeP(ctx, cts, pz.statements.map((s) => s.speaker), given);
  }

  // 解の数（全世界を総当たり。ビット演算で）
  function countSolutions(ctx, Cs, gmask) {
    const { N, K } = ctx;
    let n = 0;
    for (let w = 0; w < N * K; w++) {
      let x = gmask ? gmask[w] : ctx.valid[w % K];
      for (let i = 0; i < Cs.length && x; i++) x &= Cs[i][w];
      n += popcount(x);
    }
    return n;
  }
  function givenMask(ctx, p, v) {
    const { N, K, HP, valid } = ctx;
    const g = new Int32Array(N * K);
    for (let c = 0; c < N; c++) for (let j = 0; j < K; j++) g[c * K + j] = (v === 1 ? HP[p][j] : ~HP[p][j]) & valid[j];
    return g;
  }

  // 残っている別解の世界（正解以外）を並べる
  function altWorlds(ctx, Cs, gm, h0, c0) {
    const { N, K } = ctx;
    const out = [];
    for (let c = 0; c < N; c++) for (let j = 0; j < K; j++) {
      const w = c * K + j;
      let x = gm ? gm[w] : ctx.valid[j];
      for (let i = 0; i < Cs.length && x; i++) x &= Cs[i][w];
      for (let bit = 0; x && bit < 32; bit++) {
        if ((x >>> bit) & 1) { const h = 32 * j + bit; if (h !== h0 || c !== c0) out.push([h, c]); }
      }
    }
    return out;
  }

  function sampleContent(rng, ctx, star, s, h, c, avoid, kill) {
    const pool = poolFor(ctx, star, s);
    const want = (h >> s) & 1;
    const wts = WEIGHTS[star];
    const types = Object.keys(wts).filter((t) => pool[t] && !avoid['T:' + t]);
    for (let tries = 0; tries < 12; tries++) {
      let total = 0;
      for (const t of types) total += wts[t];
      let x = rng.next() * total, type = types[types.length - 1];
      for (const t of types) { x -= wts[t]; if (x < 0) { type = t; break; } }
      const ok = pool[type].filter((ct) => {
        const bit = (ct.T[c * ctx.K + (h >> 5)] >>> (h & 31)) & 1;
        if (bit !== want || avoid[ct.id]) return false;
        if (avoid.SELF && isSelfPair(ct, s)) return false; // 「わたしとXは同じ側/違う側」は1問に1つまで
        if (kill) {
          const kb = (ct.T[kill[1] * ctx.K + (kill[0] >> 5)] >>> (kill[0] & 31)) & 1;
          if (kb === ((kill[0] >> s) & 1)) return false; // 別解の世界でも辻褄が合ってしまう
        }
        return true;
      });
      if (ok.length) return rng.pick(ok);
    }
    return null;
  }

  const KILL_RATE = 0.9, CLIMB_ITERS = 50;
  const ONE_PER_PUZZLE = { HONESTCOUNT: 1 };
  // hard = 7〜9人の設定（HARD[N]）。3〜6人は null で、今までとまったく同じ手順・同じ乱数の使い方になる
  function buildCandidate(rng, ctx, star, withGiven, hard) {
    const N = ctx.N;
    let h;
    do { h = 0; for (let p = 0; p < N; p++) if (rng.next() < 0.5) h |= 1 << p; } while (h === 0 || h === (1 << N) - 1);
    const c = rng.int(N);
    const given = withGiven ? { p: rng.int(N), v: 0 } : null;
    if (given) given.v = (h >> given.p) & 1 ? 1 : 2;
    const gm = given ? givenMask(ctx, given.p, given.v) : null;
    const cap = hard ? hard.typeCap : 0; // 同じ種類の証言は cap 個まで（7人以上だけ）
    const cts = [];
    const avoid = {};
    const cnt = {};
    for (let s = 0; s < N; s++) {
      const ct = sampleContent(rng, ctx, star, s, h, c, avoid);
      if (!ct) return null;
      cts.push(ct); avoid[ct.id] = 1;
      if (ONE_PER_PUZZLE[ct.type]) avoid['T:' + ct.type] = 1;
      if (isSelfPair(ct, s)) avoid.SELF = 1;
      if (cap && (cnt[ct.type] = (cnt[ct.type] || 0) + 1) >= cap) avoid['T:' + ct.type] = 1;
    }
    const speakers = cts.map((_, i) => i);
    const Cs = cts.map((ct, s) => consOf(ctx, ct, s));
    let count = countSolutions(ctx, Cs, gm);
    const iters = hard ? hard.climb : CLIMB_ITERS;
    for (let it = 0; it < iters && count > 1; it++) {
      const s = rng.int(N);
      const av = {};
      const cn = {};
      for (let t = 0; t < N; t++) {
        if (t === s) continue;
        av[cts[t].id] = 1;
        if (ONE_PER_PUZZLE[cts[t].type]) av['T:' + cts[t].type] = 1;
        if (isSelfPair(cts[t], t)) av.SELF = 1;
        if (cap && (cn[cts[t].type] = (cn[cts[t].type] || 0) + 1) >= cap) av['T:' + cts[t].type] = 1;
      }
      let kill = null;
      if (rng.next() < KILL_RATE) {
        const alts = altWorlds(ctx, Cs, gm, h, c);
        if (alts.length) kill = rng.pick(alts);
      }
      const ct = sampleContent(rng, ctx, star, s, h, c, av, kill);
      if (!ct || ct === cts[s]) continue;
      const old = Cs[s];
      Cs[s] = consOf(ctx, ct, s);
      const n2 = countSolutions(ctx, Cs, gm);
      if (n2 < count || (n2 === count && rng.next() < 0.5)) { cts[s] = ct; count = n2; }
      else Cs[s] = old;
    }
    if (count !== 1) return null;
    return { h, c, given, cts, speakers };
  }

  // 証言の文。pick(n) で言い回しを選び、話し手の style の語尾を付ける
  function stmtText(ct, s, names, style, pick) {
    const self = (ct.type === 'CULPRIT' || ct.type === 'NOTCULPRIT') ? ct.a === s
      : (ct.type === 'SAME' || ct.type === 'DIFF' || ct.type === 'CULPRIT_IN') ? (ct.a === s || ct.b === s) : false;
    const list = TPL[self ? ct.type + '_SELF' : ct.type];
    const tpl = list[pick(list.length) % list.length];
    const end = (ENDINGS[style] || ENDINGS.da)[tpl[1]];
    const body = tpl[0] + end;
    let a = ct.a, b = ct.b;
    if (self && PAIR_TYPES[ct.type]) b = ct.a === s ? ct.b : ct.a;
    const parts = [];
    const re = /\{([abkn])\}/g;
    let last = 0, m;
    while ((m = re.exec(body))) {
      if (m.index > last) parts.push(body.slice(last, m.index));
      if (m[1] === 'k') parts.push(String(ct.k));
      else if (m[1] === 'n') parts.push(String(names.length));
      else parts.push({ p: m[1] === 'a' ? a : b });
      last = re.lastIndex;
    }
    if (last < body.length) parts.push(body.slice(last));
    // 文字列をまとめる
    const merged = [];
    for (const x of parts) {
      if (typeof x === 'string' && typeof merged[merged.length - 1] === 'string') merged[merged.length - 1] += x;
      else merged.push(x);
    }
    const text = merged.map((x) => typeof x === 'string' ? x : names[x.p]).join('');
    const refs = [];
    for (const x of merged) if (typeof x !== 'string' && refs.indexOf(x.p) < 0) refs.push(x.p);
    return { text, parts: merged, refs };
  }

  // 顔ぶれ: 事件の店の主人（story.job）は容疑者に入れない
  function castFor(rng, N, storyIdx) {
    const job = STORIES[storyIdx].job;
    const idx = [];
    for (let i = 0; i < POOL.length; i++) if (!job || POOL[i].job !== job) idx.push(i);
    return rng.shuffle(idx).slice(0, N);
  }

  // 生成した論理の骨組み（core）に、顔ぶれ・事件・言い回しを付けて問題にする
  function assemble(core, dress, seed) {
    const { cand, res, N, target } = core;
    const rng = dress.rng;
    const colors = rng.shuffle([0, 1, 2, 3, 4, 5, 6, 7]);
    // 色は8色。9人のときだけ、最初と最後のカード（0番と8番）が同じ色になる
    const villagers = dress.cast.map((pi, i) => ({ name: POOL[pi].name, job: POOL[pi].job, avatar: pi, color: colors[i % 8] }));
    const names = villagers.map((v) => v.name);
    const story = STORIES[dress.storyIdx];
    const statements = cand.cts.map((ct, i) => {
      const s = cand.speakers[i];
      const tx = stmtText(ct, s, names, POOL[dress.cast[s]].style, (n) => rng.int(n));
      return { speaker: s, type: ct.type, a: ct.a, b: ct.b, k: ct.k, text: tx.text, parts: tx.parts, refs: tx.refs };
    });
    let given = null;
    if (cand.given) {
      const g = cand.given;
      const val = g.v === 1 ? 'H' : 'L';
      given = { person: g.p, value: val, text: '村長のメモ：' + names[g.p] + 'は' + SW[g.v] + 'だ',
        parts: ['村長のメモ：', { p: g.p }, 'は' + SW[g.v] + 'だ'] };
    }
    const W = makeWriter(names, statements, N);
    const steps = renderSteps(res.steps, W, N);
    const usedIdx = bitsOf(res.used, N);
    const unused = [];
    for (let i = 0; i < N; i++) if (usedIdx.indexOf(i) < 0) unused.push(i);
    return {
      v: VERSION,
      seed, people: N, star: starOf(res.hyps, res.chain), targetStar: target,
      story: { title: story.title, text: story.text + '容疑者は' + N + '人。犯人は1人だけ。', job: story.job || null },
      villagers, given, statements,
      solution: { status: Array.from({ length: N }, (_, p) => (cand.h >> p) & 1 ? 'H' : 'L'), culprit: cand.c },
      steps,
      stats: { hyps: res.hyps, chain: res.chain, sum: res.sum, back: res.back, used: usedIdx.length, unused },
    };
  }

  const MAX_ATTEMPTS = 1500;
  const GIVEN_RATE = { 1: 1, 2: 0.75, 3: 0.35 };
  const coreCache = new Map();
  const pzCache = new Map();

  function normOpts(opts) {
    opts = opts || {};
    const N = Math.max(LIMITS.minPeople, Math.min(LIMITS.maxPeople, Math.floor(Number(opts.people) || 4)));
    // 7人以上は「難問」。★は3に固定する
    const target = N >= HARD_FROM ? LIMITS.hardStar : Math.max(1, Math.min(3, Math.floor(Number(opts.star) || 1)));
    const seed = opts.seed == null ? 0 : opts.seed;
    let band = typeof opts.band === 'string' && Object.prototype.hasOwnProperty.call(BANDS, opts.band) ? opts.band : null;
    if (band == null && opts.band == null) band = N >= HARD_FROM ? 'hard' : (DEFAULT_BAND[target] || null);
    return { N, target, seed, band };
  }

  // 解説の行数（画面の解説で1行ずつ並ぶ数。仮定は見出し・中の手・矛盾・結論）
  function linesOf(rawSteps) {
    let n = 0;
    for (const r of rawSteps) n += r.kind === 'hypo' ? r.sub.length + 3 : 1;
    return n;
  }
  // 7〜9人で必ず守る条件（外れた候補は「いちばん近いもの」としても使わない）:
  // 仮定の回数が上限以下・解説の行数が上限以下・証言の種類が少なすぎない
  function hardOk(res, cts, H) {
    if (res.hyps > H.hypsMax || linesOf(res.steps) > H.lines) return false;
    const seen = {};
    let kinds = 0;
    for (const ct of cts) if (!seen[ct.type]) { seen[ct.type] = 1; kinds++; }
    return kinds >= H.minTypes;
  }

  // 論理の部分だけを作る（同じ seed・人数・★・band なら同じもの）
  function buildCore(seed, N, target, bandName) {
    const rkey = String(seed) + '|' + N + '|' + target;
    const key = rkey + '|' + (bandName || '');
    if (coreCache.has(key)) return coreCache.get(key);
    const rng = makeRng(hash32(rkey));
    const ctx = ctxFor(N);
    const band = bandName ? BANDS[bandName] : null;
    const forced = bandName && Object.prototype.hasOwnProperty.call(BAND_GIVEN, bandName) ? BAND_GIVEN[bandName] : null;
    const hard = N >= HARD_FROM ? HARD[N] : null;
    const maxAtt = hard ? hard.attempts : MAX_ATTEMPTS;
    let best = null, bestScore = Infinity;
    // 確かな手がかり（村長のメモ）: ★1は必ず。★2・★3は一部の問題だけ（入口の形を散らすため）
    let withGiven = target === 1 || rng.next() < GIVEN_RATE[target];
    if (forced != null) withGiven = forced;
    for (let att = 0; att < maxAtt; att++) {
      // 見つからないときはもう一方の形で探す
      if (target !== 1 && forced == null && att === Math.floor(maxAtt * 0.6)) withGiven = !withGiven;
      const cand = buildCandidate(rng, ctx, target, withGiven, hard);
      if (!cand) continue;
      const P = makeP(ctx, cand.cts, cand.speakers, cand.given);
      const res = hard ? solveCore(P, hard.hypsMax) : solveCore(P);
      if (!res.solved) continue;
      if (hard && !hardOk(res, cand.cts, hard)) continue;
      const star = starOf(res.hyps, res.chain);
      const unused = N - popcount(res.used);
      const allow = att < maxAtt * 0.4 ? 0 : 1;
      const inBand = !band || band({ hyps: res.hyps, chain: res.chain, sum: res.sum, back: res.back, given: !!cand.given, n: N });
      if (star === target && inBand && unused <= allow) { best = { cand, res }; bestScore = -1; break; }
      const score = Math.abs(star - target) * 100 + (inBand ? 0 : 50) + unused * 10 + (unused > 1 ? 1000 : 0);
      if (score < bestScore) { bestScore = score; best = { cand, res }; }
    }
    if (!best) throw new Error('generate failed');
    const core = { cand: best.cand, res: best.res, N, target };
    cachePut(coreCache, key, core);
    return core;
  }

  function generate(opts) {
    const { N, target, seed, band } = normOpts(opts);
    const key = 'G|' + String(seed) + '|' + N + '|' + target + '|' + (band || '');
    let pz = pzCache.get(key);
    if (!pz) {
      const core = buildCore(seed, N, target, band);
      // 練習の顔ぶれと事件（通年の事件から。店の主人は容疑者に入れない）
      const rng = makeRng(hash32('dress|' + String(seed) + '|' + N + '|' + target));
      const storyIdx = ALL_YEAR[rng.int(ALL_YEAR.length)];
      const cast = castFor(rng, N, storyIdx);
      pz = assemble(core, { rng, cast, storyIdx }, seed);
      cachePut(pzCache, key, pz);
    }
    const out = clone(pz);
    out.seed = seed; // 7 と '7' は同じ問題だが、渡された型のまま返す
    return out;
  }

  /* ===================== 日替わり ===================== */
  const WEEK = [
    { star: 3, people: 6, band: 'sun' }, // 日
    { star: 1, people: 4, band: 'mon' }, // 月
    { star: 1, people: 5, band: 'tue' }, // 火
    { star: 2, people: 4, band: 'wed' }, // 水
    { star: 2, people: 5, band: 'thu' }, // 木
    { star: 2, people: 6, band: 'fri' }, // 金
    { star: 3, people: 5, band: 'sat' }, // 土
  ];
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const DAY0 = Date.UTC(2026, 9, 1);
  // 存在する日付だけを受け付ける（2026-02-30 や 2026-13-01 は例外）
  function parseDate(str) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(str == null ? '' : str));
    if (!m) throw new Error('date must be YYYY-MM-DD');
    const y = +m[1], mo = +m[2], d = +m[3];
    const t = new Date(Date.UTC(2000, 0, 1));
    t.setUTCFullYear(y, mo - 1, d);
    if (t.getUTCFullYear() !== y || t.getUTCMonth() !== mo - 1 || t.getUTCDate() !== d) throw new Error('no such date: ' + str);
    return { y, m: mo, d, t: t.getTime() };
  }
  const p2 = (x) => (x < 10 ? '0' : '') + x;
  function ymdOf(t) { const d = new Date(t); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()); }
  function localDateStr(date) {
    const d = date || new Date();
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
  }
  function addDays(dateStr, n) {
    return ymdOf(parseDate(dateStr).t + n * 86400000);
  }

  /* 事件の割り当て（No.1 からの通し番号で決まる。生成の乱数には触れない）
   * その月に使える事件のうち、最後に使ってからいちばん日がたった3件から1件を選ぶ。
   * 新しく使えるようになった事件（季節の事件・最初の日）は「使った日」を散らしておき、季節の頭にかたまらないようにする。 */
  const sched = [];
  const schedLast = STORIES.map(() => null);
  const schedOn = STORIES.map(() => false);
  function storyIndexForNo(no) {
    while (sched.length < no) {
      const n = sched.length + 1;
      const month = new Date(DAY0 + (n - 1) * 86400000).getUTCMonth() + 1;
      const elig = [];
      for (let i = 0; i < STORIES.length; i++) if (!STORIES[i].m || STORIES[i].m.indexOf(month) >= 0) elig.push(i);
      const G = elig.length;
      for (let i = 0; i < STORIES.length; i++) {
        const on = elig.indexOf(i) >= 0;
        if (on && !schedOn[i]) {
          const fake = n - G + (hash32('usotsuki-story-off-' + i) % G);
          schedLast[i] = schedLast[i] == null ? fake : Math.max(schedLast[i], fake);
        }
        schedOn[i] = on;
      }
      elig.sort((x, y) => schedLast[x] - schedLast[y] || x - y);
      // 直前の6日に出た事件と店（job）か題材（g）が同じものは外す（残りが3件未満なら外さない）
      const recent = sched.slice(-6);
      const near = (i) => recent.some((r) => r === i || (STORIES[r].job && STORIES[r].job === STORIES[i].job) || (STORIES[r].g && STORIES[r].g === STORIES[i].g));
      const far = elig.filter((i) => !near(i));
      const pool = far.length >= 3 ? far : elig;
      const pick = pool[hash32('usotsuki-story-' + n) % Math.min(3, pool.length)];
      sched.push(pick);
      schedLast[pick] = n;
    }
    return sched[no - 1];
  }

  function dailyConfig(dateStr) {
    const pd = parseDate(dateStr);
    const no = Math.round((pd.t - DAY0) / 86400000) + 1;
    const weekday = new Date(pd.t).getUTCDay();
    const cfg = WEEK[weekday];
    const ymd = String(dateStr).replace(/-/g, '');
    // No.1 より前の日付も計算はできる（事件簿では No.1 以降だけを並べる）
    const storyIdx = no >= 1 ? storyIndexForNo(no) : ALL_YEAR[hash32('usotsuki-story-' + ymd) % ALL_YEAR.length];
    return {
      no, seed: hash32('usotsuki-' + ymd), people: cfg.people, star: cfg.star, band: cfg.band,
      weekday, weekdayLabel: WD[weekday], date: dateStr, title: STORIES[storyIdx].title, storyIdx,
    };
  }
  function daily(dateStr) {
    const cfg = dailyConfig(dateStr);
    const key = 'D|' + dateStr;
    let pz = pzCache.get(key);
    if (!pz) {
      const core = buildCore(cfg.seed, cfg.people, cfg.star, cfg.band);
      const ymd = String(dateStr).replace(/-/g, '');
      const rng = makeRng(hash32('usotsuki-cast-' + ymd));
      const cast = castFor(rng, cfg.people, cfg.storyIdx);
      pz = assemble(core, { rng, cast, storyIdx: cfg.storyIdx }, cfg.seed);
      pz.no = cfg.no;
      pz.date = dateStr;
      pz.weekday = cfg.weekday;
      cachePut(pzCache, key, pz);
    }
    return clone(pz);
  }

  /* ===================== 解く・答え合わせ・ヒント ===================== */
  function solve(pz) {
    const P = pFromPuzzle(pz);
    const res = solveCore(P);
    const W = makeWriter(pz.villagers.map((v) => v.name), pz.statements, pz.people);
    return { solved: res.solved, steps: renderSteps(res.steps, W, pz.people), stars: starOf(res.hyps, res.chain), hyps: res.hyps, chain: res.chain };
  }

  function check(pz, ans) {
    const N = pz.people;
    if (!ans || !Array.isArray(ans.status) || ans.status.length !== N || ans.status.some((v) => v !== 'H' && v !== 'L') ||
      !Number.isInteger(ans.culprit) || ans.culprit < 0 || ans.culprit >= N) {
      return { ok: false, contradiction: null, incomplete: true, message: '全員の判定と犯人を選んでから提出してね。' };
    }
    const names = pz.villagers.map((v) => v.name);
    const W = makeWriter(names, pz.statements, N);
    let h = 0;
    ans.status.forEach((v, i) => { if (v === 'H') h |= 1 << i; });
    const c = ans.culprit;
    const word = (v) => (v === 'H' ? '正直者' : '嘘つき');
    if (pz.given && ans.status[pz.given.person] !== pz.given.value) {
      const p = pz.given.person;
      return { ok: false, contradiction: { kind: 'given', index: -1, speaker: -1, person: p,
        message: 'あなたの推理では、' + names[p] + 'は' + word(ans.status[p]) + '。でも村長のメモには「' + names[p] + 'は' + word(pz.given.value) + 'だ」とある。' } };
    }
    const st = ans.status.map((v) => (v === 'H' ? 1 : 2));
    for (let i = 0; i < pz.statements.length; i++) {
      const S = pz.statements[i];
      const t = truthOf(S.type, S.a, S.b, S.k, h, c);
      const want = ans.status[S.speaker] === 'H';
      if (t !== want) {
        const r = W.reason(i, t, st, 1 << c);
        const why = r ? W.conn(r) + '、' : '';
        // 犯人についての証言なら、選んだ犯人も書く（理由が「犯人を〇〇にしたから」になるため）
        const who = CULPRIT_TYPES[S.type] ? 'で、犯人は' + names[c] : '';
        return { ok: false, contradiction: { kind: 'statement', index: i, speaker: S.speaker,
          message: 'あなたの推理では、' + names[S.speaker] + 'は' + word(ans.status[S.speaker]) + who + '。でもその場合、' + why +
            names[S.speaker] + 'の『' + S.text + '』は' + (t ? '本当' : 'ウソ') + 'になってしまう。' } };
      }
    }
    const sol = pz.solution;
    const same = sol.culprit === c && sol.status.every((v, i) => v === ans.status[i]);
    return same ? { ok: true } : { ok: false, contradiction: null, message: 'どの証言とも食い違いは見つからないけれど、答えとは違うよ。判定を見直してみよう。' };
  }

  /* ヒント。state = { status:['H'|'L'|null...], culprit:index|null, seen:[手順の番号...]（任意） }

    const SKY = { light: '#E7ECF2', dark: '#0B1220' }; // = CSS の --sky

    const sb = plug('StatusBar');

    if (!C) return null;

      master = AC.createGain(); master.gain.value = 0.55; master.connect(AC.destination);
      noiseBuf = AC.createBuffer(1, Math.floor(AC.sampleRate * 0.4), AC.sampleRate);
      const d = noiseBuf.getChannelData(0); let x = 12345;
      for (let i = 0; i < d.length; i++) { x = (x * 1103515245 + 12345) & 0x7fffffff; d[i] = (x / 0x3fffffff) - 1; }

  const SEAL_CH = { H: '正', L: '嘘', C: '犯' };
  function sealSVG(kind) {
    const ch = SEAL_CH[kind];
    let g;
    if (kind === 'H') g = '<circle cx="20" cy="20" r="18" class="sf"/><circle cx="20" cy="20" r="15.2" class="sw" stroke-width=".9" opacity=".75"/><text x="20" y="21" text-anchor="middle" dominant-baseline="central" font-size="21" class="st st-w">' + ch + '</text>';
    else if (kind === 'L') g = '<circle cx="20" cy="20" r="17.2" class="sr" stroke-width="2.6"/><circle cx="20" cy="20" r="14" class="sr" stroke-width=".9"/><text x="20" y="21" text-anchor="middle" dominant-baseline="central" font-size="19" class="st st-r">' + ch + '</text>';
    else g = '<rect x="3" y="3" width="34" height="34" rx="3" class="sf"/><rect x="6" y="6" width="28" height="28" rx="1.5" class="sw" stroke-width=".9" opacity=".75"/><text x="20" y="21" text-anchor="middle" dominant-baseline="central" font-size="21" class="st st-w">' + ch + '</text>';
    return '<svg viewBox="0 0 40 40" aria-hidden="true"><g filter="url(#ink)">' + g + '</g></svg>';
  }
  function ghostSVG(kind) {
    const shape = kind === 'C' ? '<rect x="4" y="4" width="32" height="32" rx="3" class="g-ring"/>' : '<circle cx="20" cy="20" r="17" class="g-ring"/>';
    return '<svg viewBox="0 0 40 40" aria-hidden="true">' + shape + '<text x="20" y="21" text-anchor="middle" dominant-baseline="central" font-size="17" class="st g-t">' + SEAL_CH[kind] + '</text></svg>';
  }
  function sealBox(kind, i) {
    const r = (((i * 37 + (kind === 'H' ? 5 : kind === 'L' ? 11 : 23)) % 19) - 9);
    return '<span class="sealbox" aria-hidden="true"><span class="ghost">' + ghostSVG(kind) + '</span><span class="imp" style="--r:' + r + 'deg">' + sealSVG(kind) + '</span></span>';
  }

  /* ---------- 名前の色付け ---------- */
  function partsHTML(pz, parts, text) {
    if (!Array.isArray(parts)) return esc(text);
    return parts.map((x) => {
      if (x && typeof x === 'object' && Number.isInteger(x.p) && pz.villagers[x.p]) {
        const v = pz.villagers[x.p];
        return '<button type="button" class="nm" data-p="' + x.p + '" style="--pc:var(--p' + v.color + ')">' + esc(v.name) + '</button>';
      }
      return esc(x);
    }).join('');
  }
  function richText(pz, text) {
    let h = esc(text);
    const vs = pz.villagers.map((v) => v).sort((a, b) => b.name.length - a.name.length);
    if (!vs.length) return h;
    const re = new RegExp(vs.map((v) => v.name).join('|'), 'g');
    return h.replace(re, (m) => { const v = vs.find((x) => x.name === m); return '<b class="nmx" style="--pc:var(--p' + v.color + ')">' + m + '</b>'; });
  }
  function emphasize(html) {
    const k = html.lastIndexOf('→');
    if (k >= 0) return html.slice(0, k) + '<span class="arrow">→</span><strong>' + html.slice(k + 1).trim() + '</strong>';
    const j = html.lastIndexOf('だから、');
    if (j >= 0) return html.slice(0, j + 4) + '<strong>' + html.slice(j + 4) + '</strong>';
    return html;
  }

  /* ---------- 画面の切り替え ---------- */
  const VIEWS = ['home', 'play', 'explain', 'book', 'howto', 'settings'];
  let cur = 'home';
  const scrollMem = {};
  // 文字の選択を消す（ダブルクリックの選択が残ったまま次の画面や結果・共有画像を開くと、全部が青く塗られて見えるため）
  function clearSel() { try { const g = window.getSelection && window.getSelection(); if (g && g.rangeCount) g.removeAllRanges(); } catch (e) { /* 選択の無い環境 */ } }
  function show(v, opt) {
    opt = opt || {};
    clearSel();
    if ((v === 'play' || v === 'explain') && !P && !opt.loading) v = 'home';
    if (cur === 'play' && v !== 'play') { loadToken++; cancelHeavy(); progStop(); timerStop(); saveProgress(); closeSheet(); }
    if (v !== 'play') hideResult();
    scrollMem[cur] = window.scrollY;
    VIEWS.forEach((n) => { $('#v-' + n).hidden = n !== v; });
    cur = v;
    document.body.dataset.view = v;
    if (v === 'home') renderHome();
    if (v === 'book') renderBook();
    if (v === 'howto') renderHowto();
    if (v === 'settings') { confirmOpen = false; renderSettings(); }
    if (v === 'play') { if (P && P.ready) renderBar(); timerStart(); }
    else $('#playBar').hidden = true;
    window.scrollTo(0, opt.restore ? (scrollMem[v] || 0) : 0);
  }

  /* 画面の行き来をブラウザの履歴にも積む（Android の戻るボタン・iOS の戻るスワイプでアプリ内の前の画面へ） */
  const navStack = ['home'];
  let histOK = false;
  // 読み込み直したとき（Android の引っぱって更新・裏で捨てられたタブの開き直しなど）は、前の画面の履歴が後ろに残っている。
  // そのままだと戻るが空振りするので、このアプリの最初の項目（usd:0）まで戻ってから始める。
  // 戻ったときの popstate は usd:0 で、今の画面（ホーム）と同じなので何もしない。後ろの古い項目は次に進むときに切り捨てられる
  try {
    const u0 = history.state && Number.isInteger(history.state.usd) ? history.state.usd : 0;
    if (u0 > 0) history.go(-u0); else history.replaceState({ usd: 0 }, '');
    histOK = true;
  } catch (e) { histOK = false; }
  function go(v, opt) {
    if ((v === 'play' || v === 'explain') && !P && !(opt && opt.loading)) v = 'home';
    const k = navStack.lastIndexOf(v);
    if (k >= 0) {
      // すでに通ってきた画面なら、そこまで戻る（履歴も同じだけ戻す）
      const n = navStack.length - 1 - k;
      navStack.length = k + 1;
      show(v, opt);
      if (n > 0 && histOK) { try { history.go(-n); } catch (e) { histOK = false; } }
    } else {
      navStack.push(v);
      if (histOK) { try { history.pushState({ usd: navStack.length - 1 }, ''); } catch (e) { histOK = false; } }
      show(v, opt);
    }
  }
  function goBack() { go(navStack.length > 1 ? navStack[navStack.length - 2] : 'home', { restore: true }); }
  window.addEventListener('popstate', (e) => {
    const d = e.state && Number.isInteger(e.state.usd) ? e.state.usd : 0;
    const top = navStack.length - 1;
    if (d === top) return;                       // こちらから history.go で戻したとき
    if (d > top) { try { history.go(top - d); } catch (er) { /* 進むは使わない */ } return; }
    // 戻る: 共有画像・結果・パネルが開いていれば、まずそれを閉じる（共有画像だけなら結果は残す）
    if (!$('#shareView').hidden) {
      closeShareView();
      try { history.pushState({ usd: top }, ''); } catch (er) { histOK = false; }
      return;
    }
    if (!$('#result').hidden || !$('#sheet').hidden) {
      hideResult(); closeSheet();

  // 問題の作り方が変わる前の途中は、開くと最初からになるので「未解決」として見せる
  function liveRec(r) { return r && (r.state === 'solved' || r.v === Engine.VERSION) ? r : null; }
  function touched(r) {
    return !!r && r.v === Engine.VERSION && ((r.marks || []).some(Boolean) || r.culprit != null || r.mistakes > 0 || r.hints > 0);
  }

  /* ---------- 事件（プレイ） ---------- */
  let P = null;            // いま開いている事件
  let loadToken = 0;
  const T = { running: false, t0: 0 };
  function elapsedNow() { return P ? P.elapsed + (T.running ? (performance.now() - T.t0) / 1000 : 0) : 0; }
  function timerStart() {
    if (T.running || !P || P.state !== 'playing' || !P.ready || document.hidden || cur !== 'play') return;
    T.running = true; T.t0 = performance.now();
  }
  function timerStop() {
    if (!T.running) return;
    if (P) P.elapsed += (performance.now() - T.t0) / 1000;
    T.running = false;
  }
  function playRec(el) {
    return {
      marks: P.marks.slice(), culprit: P.culprit, mistakes: P.mistakes, hints: P.hints, attempts: P.attempts, elapsed: el,
      hintSeen: P.hintSeen.slice(), seenSteps: (P.seenSteps || []).slice(), lastWrong: P.lastWrong || null, v: Engine.VERSION,
    };
  }
  function saveProgress() {
    if (!P || !P.ready) return;
    const el = Math.round(elapsedNow());
    update((s) => {
      if ((s.epoch || '') !== (P.epoch || '')) return;   // 開いたあとに別のタブで記録が消された: 書き戻さない
      if (P.mode === 'daily') {
        const old = s.daily[P.date];
        if (old && old.state === 'solved') return; // 解決済みの記録は上書きしない（別のタブで先に解いた分も守る）
        const rec = Object.assign({ state: P.state }, playRec(el), { solvedOnDay: !!P.solvedOnDay, title: P.pz.story.title });
        // その日のうちに開いたことを記録に残す（開き直し・読み込み直しのあとも、翌朝3時までなら連続に数える）
        if (P.openedOnDay || (old && old.openedOnDay === true)) rec.openedOnDay = true;
        if (P.state === 'solved' && P.streakAtSolve != null) rec.streak = P.streakAtSolve;
        s.daily[P.date] = rec;
      } else if (P.state === 'playing') {
        pracSet(s, P.slot, Object.assign({ seed: P.seed, star: P.star, people: P.people }, playRec(el)));
      }
    });
  }

  // heavy: 9人など時間のかかる生成。進み具合の帯と経過秒数を出す
  function loadingHTML(heavy) {
    return '<div class="loading" role="status"><svg class="ld-art" viewBox="0 0 92 80" aria-hidden="true">' +
      '<path d="M8 22 a4 4 0 0 1 4-4 h20 l6 6 h42 a4 4 0 0 1 4 4 v42 a4 4 0 0 1-4 4 H12 a4 4 0 0 1-4-4z" fill="var(--paper-3)" stroke="var(--ink-2)" stroke-width="2"/>' +
      '<g class="sheet1"><rect x="20" y="14" width="46" height="44" rx="2" fill="var(--paper)" stroke="var(--ink-2)" stroke-width="2"/><path d="M28 26 h30 M28 34 h22 M28 42 h26" stroke="var(--rule-2)" stroke-width="2.4" stroke-linecap="round"/></g>' +
      '<path d="M8 36 h76 v34 a4 4 0 0 1-4 4 H12 a4 4 0 0 1-4-4z" fill="var(--paper-2)" stroke="var(--ink-2)" stroke-width="2"/>' +
      '<g class="lens"><circle cx="58" cy="54" r="9" fill="none" stroke="var(--shu)" stroke-width="3"/><path d="M64.5 60.5 l8 8" stroke="var(--shu)" stroke-width="3.4" stroke-linecap="round"/></g>' +
      '</svg><p>事件ファイルを用意しています</p>' +
      (heavy ? '<div class="ld-prog" aria-hidden="true"><i id="ldBar"></i></div>' +
        '<p class="ld-note">容疑者9人の大事件。答えが1つに決まり、順に考えれば解けるかを確かめています<span id="ldSec" class="tnum"></span></p>' : '') +
      '</div>';
  }
  // 進み具合の帯（エンジンは途中経過を返さないので、時間に合わせて9割まで進め、できたら満たす）
  let progT = 0;
  function progStart(token) {
    clearInterval(progT);
    const t0 = performance.now();
    const step = () => {
      if (token !== loadToken) { progStop(); return; }
      const sec = (performance.now() - t0) / 1000;
      const bar = $('#ldBar'), lab = $('#ldSec');
      if (bar) bar.style.width = (92 * (1 - Math.exp(-sec / 1.6))).toFixed(1) + '%';
      if (lab) lab.textContent = sec >= 1 ? '（' + Math.floor(sec) + '秒）' : '';
    };
    step(); progT = setInterval(step, 250);
  }
  function progStop() { clearInterval(progT); progT = 0; }
  function progDone() { progStop(); const bar = $('#ldBar'); if (bar) bar.style.width = '100%'; }

  /* 9人の問題は Web Worker で作る（画面を止めない）。エンジンは index.html の中の同じ部分をそのまま使う。
     Worker が使えない・読めない環境（Claude Artifact の制限など）では、メインスレッドで作る */
  const ENG_A = '// ==ENGINE ' + 'START==', ENG_B = '// ==ENGINE ' + 'END==';   // 目印そのものをここに書かない（検査が目印を探すため）
  let engineSrc = null;
  function engineSource() {
    if (engineSrc != null) return engineSrc;
    engineSrc = '';
    try {
      const sc = Array.from(document.scripts).find((s) => s.textContent.indexOf(ENG_A) >= 0);
      if (sc) {
        const tx = sc.textContent, a = tx.indexOf(ENG_A), b = tx.indexOf(ENG_B);
        if (a >= 0 && b > a) engineSrc = tx.slice(a, b);
      }
    } catch (e) { engineSrc = ''; }
    return engineSrc;
  }
  const WORKER_TAIL = '\n;self.onmessage=function(e){var d=e.data||{},r;' +
    'try{var E=(typeof Engine!=="undefined")?Engine:self.Engine;r={ok:true,pz:JSON.stringify(E.generate({seed:d.seed,people:d.people,star:d.star}))};}' +
    'catch(err){r={ok:false,error:String((err&&err.message)||err)};}self.postMessage(r);};' +
    'self.postMessage({ready:true});\n';
  let heavyJob = null;
  let workerOff = false;   // 一度 Worker で作れなかった環境（CSP で止められる など）では、次からメインスレッドで作る
  // 作りかけの Worker だけを止める（進み具合の帯は止めない。帯は openCase の最初・画面を離れるとき・できたときに止める）
  function cancelHeavy() { if (heavyJob) { const j = heavyJob; heavyJob = null; j.cancel(); } }
  function genHeavy(opts) {
    cancelHeavy();
    return new Promise((resolve, reject) => {
      let settled = false, w = null, url = null, readyT = 0, ready = false, mainT = 0;
      const stopWorker = () => {
        clearTimeout(readyT);
        if (w) { try { w.terminate(); } catch (e) { /* 止まっている */ } w = null; }
        if (url) { try { URL.revokeObjectURL(url); } catch (e) { /* 消えている */ } url = null; }
      };
      const fin = (ok, v) => {
        if (settled) return;
        settled = true; stopWorker(); clearTimeout(mainT);
        if (heavyJob === job) heavyJob = null;
        (ok ? resolve : reject)(v);
      };
      const job = { cancel: () => fin(false, new Error('cancel')) };
      heavyJob = job;
      // 代わりにメインスレッドで作る（描画を1回通してから）
      const onMain = () => {
        if (settled) return;
        if (w || url) workerOff = true;   // Worker を試して失敗した（読めない・返事が無い・落ちた）
        stopWorker();
        mainT = setTimeout(() => {
          if (settled) return;
          try { fin(true, Engine.generate(opts)); } catch (e) { fin(false, e); }
        }, 60);
      };
      const src = engineSource();
      if (workerOff || !src || typeof Worker === 'undefined' || typeof Blob === 'undefined' || !window.URL || !URL.createObjectURL) { onMain(); return; }
      try {
        url = URL.createObjectURL(new Blob([src + WORKER_TAIL], { type: 'text/javascript' }));
        w = new Worker(url);
      } catch (e) { onMain(); return; }
      w.onmessage = (e) => {
        const d = e.data || {};
        if (d.ready) { ready = true; clearTimeout(readyT); return; }
        if (d.ok) { try { fin(true, JSON.parse(d.pz)); } catch (er) { fin(false, er); } }
        else fin(false, new Error(d.error || 'generate failed'));
      };
      // 読み込めない（CSP など）・途中で落ちた → メインスレッドで作り直す
      w.onerror = (e) => { if (e && e.preventDefault) e.preventDefault(); onMain(); };
      readyT = setTimeout(() => { if (!ready) onMain(); }, 2500);
      try { w.postMessage({ seed: opts.seed, people: opts.people, star: opts.star }); } catch (e) { onMain(); }
    });
  }
  function preparingHTML() {
    return '<div class="loading"><div class="ld-err">' + icon('i-hourglass', 'ld-ic') +
      '<p>難問（容疑者9人）は準備中です</p>' +
      '<small>9人の事件は、答えが1つに決まるかを確かめる仕組みを仕上げているところです。それまでは★3の「むずかしい」で腕を磨いてください。</small>' +
      '<button class="btn btn-pri" type="button" data-practice="3">' + icon('i-search') + '★3 の練習を開く</button>' +
      '<button class="btn btn-ghost" type="button" id="soonBack">' + icon('i-back') + '戻る</button>' +
      '</div></div>';
  }
  function setTop(label, star) {
    $('#tbNo').textContent = label;
    $('#tbStars').innerHTML = star ? starsHTML(star).replace(/^<span[^>]*>|<\/span>$/g, '') : '';
    $('#tbClock').textContent = fmtTime(P ? elapsedNow() : 0);
    $('#tbMiss').textContent = P ? P.mistakes : 0;
    $('#tbMissBox').classList.toggle('hit', !!(P && P.mistakes));
  }
  // 生成は重いことがあるので、まず「用意しています」を描いてから次のフレームで作る
  function openCase(spec) {
    const token = ++loadToken;
    cancelHeavy(); progStop();
    timerStop(); saveProgress(); closeSheet(); hideResult();
    P = null;
    go('play', { loading: true });
    $('#playBar').hidden = true;
    renderRoster();
    const heavy = spec.mode === 'practice' && spec.people >= 7;
    $('#playBody').innerHTML = loadingHTML(heavy);
    setTop(spec.mode === 'daily' ? 'No.' + Engine.dailyConfig(spec.date).no : spec.slot === 'hard' ? '難問' : '練習', spec.star || (spec.mode === 'daily' ? Engine.dailyConfig(spec.date).star : 0));
    $('#tbClock').textContent = '0:00'; $('#tbMiss').textContent = '0';
    const t0 = performance.now();
    if (heavy) {
      // 9人: Worker で作る。9人に対応していないエンジン・作れない・人数が違うときは「準備中」
      const soon = () => {
        if (token !== loadToken) return;
        progStop();
        $('#playBody').innerHTML = preparingHTML();
        const b = $('#soonBack'); if (b) b.onclick = () => { loadToken++; goBack(); };
      };
      if (!hardReady()) { setTimeout(soon, 380); return; }
      progStart(token);
      genHeavy({ seed: spec.seed, people: spec.people, star: spec.star }).then((pz) => {
        if (token !== loadToken) return;
        if (!pz || pz.people !== spec.people || !Array.isArray(pz.villagers) || pz.villagers.length !== spec.people) { soon(); return; }
        progDone();
        setTimeout(() => { if (token === loadToken) startCase(spec, pz); }, 420);   // 満ちた帯を一瞬見せてから
      }, (e) => { if (!(e && e.message === 'cancel')) soon(); });
      return;
    }
    let fired = false;
    const build = () => {
      if (fired || token !== loadToken) return;
      fired = true;
      let pz;
      try {
        pz = spec.mode === 'daily' ? Engine.daily(spec.date) : Engine.generate({ seed: spec.seed, people: spec.people, star: spec.star });
        // 練習の新しい事件は、直前の練習と同じ題名なら作り直す（続けて同じ事件名が出ないように）
        for (let k = 0; k < 4 && spec.mode === 'practice' && !spec.resume && spec.avoid && pz.story.title === spec.avoid; k++) {
          spec.seed = practiceSeed();
          pz = Engine.generate({ seed: spec.seed, people: spec.people, star: spec.star });
        }
      } catch (e) {
        $('#playBody').innerHTML = '<div class="loading"><div class="ld-err"><p>事件ファイルを開けませんでした。</p><button class="btn" type="button" id="retryOpen">もう一度開く</button></div></div>';
        $('#retryOpen').onclick = () => openCase(spec);
        return;
      }
      const wait = Math.max(0, 380 - (performance.now() - t0));
      setTimeout(() => { if (token === loadToken) startCase(spec, pz); }, wait);
    };
    // 表示を描いてから作る。描画が止まっている環境でも進むよう、時間でも起こす
    requestAnimationFrame(() => setTimeout(build, 16));
    setTimeout(build, 120);
  }
  function startCase(spec, pz) {
    const N = pz.people;
    // エンジンの色は8色（0〜7）。9人では1人目と9人目が同じ色になるので、9人目以降は画面だけの色（--p8）にする
    if (N > 8) pz.villagers.forEach((v, i) => { if (i >= 8 && pz.villagers.some((w, j) => j !== i && w.color === v.color)) v.color = i; });
    const okMarks = (m) => Array.isArray(m) && m.length === N ? m.map((x) => (x === 'H' || x === 'L' ? x : null)) : new Array(N).fill(null);
    const okC = (c) => (Number.isInteger(c) && c >= 0 && c < N ? c : null);
    let base;
    if (spec.mode === 'daily') {
      const rec = S.daily[spec.date];
      base = rec || {};
      P = { mode: 'daily', date: spec.date, from: spec.from || 'home', pz, state: rec && rec.state === 'solved' ? 'solved' : 'playing', solvedOnDay: !!(rec && rec.solvedOnDay),
        openedOnDay: openedOnDayOf(spec.date, today(), rec) };   // その日のうちに開いたか（0時をまたいで解いたときに、3時までは開いた日の分として数える）
      // 結果の「連続〇日」は解いた時点の値（古い記録は、最後に解いた日がその日なら今の値と同じ）
      if (P.state === 'solved' && P.solvedOnDay) {
        P.streakAtSolve = Number.isInteger(rec.streak) ? rec.streak : S.stats.lastDailyDate === spec.date ? S.stats.streak : null;
      }

      base = spec.resume || {};
      const slot = spec.slot === 'hard' ? 'hard' : spec.star;
      P = { mode: 'practice', slot, hard: slot === 'hard', from: spec.from || 'home', pz, seed: spec.seed, star: spec.star, people: spec.people, state: 'playing' };
      lastPracticeTitle = pz.story.title;
    }
    // 問題の作り方が変わる前に保存した途中は、別の問題のものなので使わない（判定もミス・ヒント・時間も。解決済みはそのまま）
    const stale = P.state !== 'solved' && base.v !== Engine.VERSION;
    const b = stale ? {} : base;
    P.epoch = S.epoch || '';
    Object.assign(P, {
      marks: okMarks(b.marks), culprit: okC(b.culprit), mistakes: cnt(b.mistakes), hints: cnt(b.hints),
      attempts: typeof b.attempts === 'string' ? b.attempts : '', elapsed: Math.max(0, num(b.elapsed, 0)),
      hintSeen: Array.isArray(b.hintSeen) ? b.hintSeen.slice() : [], seenSteps: Array.isArray(b.seenSteps) ? b.seenSteps.slice() : [],
      lastWrong: typeof b.lastWrong === 'string' ? b.lastWrong : null, lockUntil: 0, storyOpen: true, ready: true,
    });
    if (P.state === 'solved') { P.marks = pz.solution.status.slice(); P.culprit = pz.solution.culprit; }
    if (P.date) titleCache[P.date] = pz.story.title;
    saveProgress();
    renderBoard(true);
    clearSel();   // 練習カードのトリプルクリックなどで、出てきた盤面の題名・あらましが選ばれたままにならないように
    timerStart();
  }

  function caseLabel() { return P.mode === 'daily' ? 'No.' + P.pz.no : P.hard ? '難問' : '練習'; }
  // 7人以上はカードをつめて並べ、見出しの下に名簿（名前と判子の印。押すとそのカードへ）を出す
  const DENSE_FROM = 7;
  function renderRoster() {
    const el = $('#roster');

    const pz = P.pz;

    el.hidden = false;

  }
  function updateRoster(i) {
    const b = $('#roster .rs[data-ri="' + i + '"]'); if (!b || !P) return;
    const m = P.marks[i], c = P.culprit === i, v = P.pz.villagers[i];
    b.querySelector('.rs-m').innerHTML = (m === 'H' ? '<i class="h">正</i>' : m === 'L' ? '<i class="l">嘘</i>' : '<i class="n"></i>') + (c ? '<i class="c">犯</i>' : '');
    b.setAttribute('aria-label', v.name + '（' + (m === 'H' ? '正直者' : m === 'L' ? '嘘つき' : '未判定') + (c ? '・犯人' : '') + '）のカードへ');
  }
  function renderBoard(enter) {
    const pz = P.pz;
    const solved = P.state === 'solved';
    const hasCount = pz.statements.some((s) => s.type === 'HONESTCOUNT');
    let h = '<div class="case-head">' +
      '<div class="ch-line"><span>' + (P.mode === 'daily' ? esc(dateLabel(P.date)) : P.hard ? '難問（練習）' : '練習用の事件') + '</span><span class="sep"></span>' +
      starsHTML(pz.star) + '<span class="sep"></span><span>容疑者' + pz.people + '人</span></div>' +
      '<h1 class="ch-title">' + esc(pz.story.title) + '</h1>' +
      '<div class="ch-story" id="chStory"' + (P.storyOpen ? '' : ' hidden') + '><p>' + esc(pz.story.text) + '</p></div>' +
      '<button type="button" class="linkish" id="storyToggle" aria-controls="chStory" aria-expanded="' + P.storyOpen + '">' + (P.storyOpen ? 'あらましをたたむ' : 'あらましを読む') + icon('i-down') + '</button>' +
      (solved ? '<div class="ch-seal" id="chSeal">' + solvedSealSVG() + '</div>' : '') +

  // その問題で「同じ側」「違う側」が初めて出る証言の下に、言葉の意味を小さく添える
  function sideNote(pz, s) {

    const notes = [];
    if (s.text.indexOf('同じ側') >= 0 && first('同じ側') === s) notes.push('同じ側＝2人とも正直者か、2人とも嘘つき');

  function cardHTML(i, enter) {

  function updateCard(i, stamp) {
    const card = $('#card-' + i); if (!card) return;

  function remaining() {

  }
  // いまの答え（判定と犯人）。直前に違っていた答えと同じなら、もう一度は提出させない
  const answerKey = () => P.marks.map((m) => m || '-').join('') + '|' + P.culprit;
  const sameAsWrong = () => !!P.lastWrong && P.lastWrong === answerKey();
  function renderBar() {

  function updateSubmit() {

  }

  function onMark(i, k) {
    if (!P || P.state !== 'playing') return;
    let stamped = null;
    if (k === 'C') {
      const prev = P.culprit;
      P.culprit = prev === i ? null : i;
      if (P.culprit === i) stamped = 'C';
      if (prev != null && prev !== i) updateCard(prev);
    } else {
      P.marks[i] = P.marks[i] === k ? null : k;

    clearContra();

    updateCard(i, stamped);

  function clearContra() {

  }
  function scrollToEl(el) {
    const tb = $('#v-play .topbar').getBoundingClientRect().bottom;
    const sheet = $('#sheet');
    const bottomLimit = window.innerHeight - $('#playBar').offsetHeight - (sheet.hidden ? 0 : sheet.offsetHeight) - 8;
    const r = el.getBoundingClientRect();
    if (r.top >= tb + 6 && r.bottom <= bottomLimit) return;
    const room = bottomLimit - tb;
    let delta = r.top - tb - 10;
    if (r.height < room) delta -= Math.max(0, (room - r.height) / 3);
    window.scrollTo({ top: Math.max(0, window.scrollY + delta), behavior: reduceMotion() ? 'auto' : 'smooth' });
  }
  function focusCards(list, scroll) {

      // 名簿の同じ人も光らせる（9人のとき、いまどこを見ているかが分かるように）
      const rs = $('#roster .rs[data-ri="' + c.dataset.i + '"]');
      if (rs) { rs.classList.add('is-focus'); clearTimeout(rs._ft); rs._ft = setTimeout(() => rs.classList.remove('is-focus'), 2600); }
    });

  }
  function focusMemo() {

  /* 下から出るパネル（ヒント・食い違い）。カードはそのまま触れる */
  function openSheet(o) {
    const sh = $('#sheet');

  // 「犯人は〇〇ではない」のような候補の絞り込みは画面に印を付けられないので、
  // ヒントで見せた絞り込みの手順の番号を seen としてエンジンに渡し、次からは飛ばしてもらう
  const narrowOnly = (st) => !!(st && st.facts && st.facts.length && st.facts.every((f) => f.kind === 'culprit' && f.cand && f.cand.length > 1));
  function hintFor(level) {
    const seen = P.seenSteps || (P.seenSteps = []);
    return Engine.hint(P.pz, { status: P.marks.map((m) => m || null), culprit: P.culprit, seen: seen.slice() }, level);
  }
  function showHint(level) {
    if (!P || P.state !== 'playing') return;
    let r;
    try { r = hintFor(level); } catch (e) { r = null; }
    if (!r || typeof r.text !== 'string') r = { text: 'いまはヒントを用意できませんでした。', focus: [], steps: [] };
    const idx = Array.isArray(r.steps) ? r.steps.filter((j) => Number.isInteger(j) && P.pz.steps[j]) : [];
    const seen = P.seenSteps || (P.seenSteps = []);
    P.pendingNarrow = null;
    if (level === 2) idx.forEach((j) => { if (narrowOnly(P.pz.steps[j]) && seen.indexOf(j) < 0) seen.push(j); });
    else if (idx.length && narrowOnly(P.pz.steps[idx[0]])) P.pendingNarrow = idx[0];
    const done = r.kind === 'done' || r.text.indexOf('全員の判定と犯人がそろいました') === 0;
    // 同じ一手へのヒントは、何度開いても1回だけ数える（「段|次に印が付く手順」で覚え、開き直しても残す）。
    // 2段目を見たあとの同じ手順の1段目は、新しいヒントではない
    const tgt = idx.length ? 's' + idx[idx.length - 1] : 't' + r.text;
    const key = r.kind === 'review' ? 'r|' + r.text : level + '|' + tgt;
    const seenKey = (k) => P.hintSeen.indexOf(k) >= 0;
    const isNew = r.kind === 'review' ? !seenKey(key) : level === 2 ? !seenKey(key) : !seenKey(key) && !seenKey('2|' + tgt);
    if (!done && isNew) { P.hintSeen.push(key); P.hints++; }
    saveProgress();
    sfx('hint');
    const fix = r.kind === 'review' || /見直してみよう/.test(r.text);
    // 2段目は解説と同じ形で見せる（仮定は字下げの箱。絞り込みと次の一手をまとめて返すこともある）
    // 仮定の手順は中身が長い（9人では4手以上）ので、わかること（結論）を先に1行で見せ、パネルも高くする
    const hasHypo = level === 2 && idx.some((j) => P.pz.steps[j].kind === 'hypo');
    const body2 = idx.length && !done && !fix
      ? idx.map((j) => {
        const st = P.pz.steps[j];
        if (st.kind !== 'hypo') return '<p>' + stepLine(P.pz, st.text) + '</p>';
        return '<p class="hy-lead"><span class="lead-k">この一手でわかること</span><strong>' + richText(P.pz, String(st.conclusion).replace(/^だから、/, '')) + '</strong></p>' +
          '<div class="sheet-hy">' + hypoHTML(P.pz, st) + '</div>';

      : '<p>' + richText(P.pz, r.text) + '</p>';
    openSheet({
      title: level === 2 ? '次の一手' : fix ? '見直しのヒント' : 'ヒント',
      icon: 'i-bulb', tall: hasHypo && !done && !fix,
      body: (level === 2 ? body2 : '<p>' + richText(P.pz, r.text) + '</p>') +
        '<p class="sub">使ったヒント ' + P.hints + '回</p>',

        '<button class="btn btn-ghost" type="button" data-sheet="close">閉じる</button>',

    else focusCards(r.focus);
  }

  function submit() {
    if (!P || P.state !== 'playing') return;
    const r0 = remaining(); if (r0.left || r0.needC) return;
    const now = performance.now();
    if (now < P.lockUntil || sameAsWrong()) return;   // 2回タップ・何も直していない再提出は数えない
    P.lockUntil = now + 500;
    let r;
    try { r = Engine.check(P.pz, { status: P.marks.slice(), culprit: P.culprit }); } catch (e) { r = { ok: false, contradiction: null }; }
    if (r.ok) return onSolved();
    if (r.incomplete) { updateSubmit(); return; }
    timerStop();
    P.mistakes++; P.attempts += '□'; P.lastWrong = answerKey();
    timerStart();
    saveProgress();
    updateSubmit();
    const mb = $('#tbMissBox');
    $('#tbMiss').textContent = P.mistakes; mb.classList.add('hit'); mb.classList.remove('bump'); void mb.offsetWidth; mb.classList.add('bump');
    sfx('wrong'); buzz('wrong');

    const c = r.contradiction;
    let target = null;
    if (c && c.kind === 'given') { target = $('#memo'); if (target) target.classList.add('is-contra'); }

      actions: '<button class="btn" type="button" data-sheet="close">閉じて見直す</button>',
    });
    if (target) setTimeout(() => scrollToEl(target), 60);
  }

  function onSolved() {
    timerStop();
    P.elapsed = Math.round(P.elapsed);
    P.state = 'solved'; P.attempts += '■';
    P.marks = P.pz.solution.status.slice(); P.culprit = P.pz.solution.culprit; P.lastWrong = null;
    if (P.mode === 'daily') {
      const t = today();
      // その日のうちに開いた事件を、0時をまたいで翌朝3時までに解いたときも、開いた日の分として数える
      P.solvedOnDay = countsOnDay(P.date, P.openedOnDay, t, new Date().getHours());
      update((s) => {
        if ((s.epoch || '') !== (P.epoch || '')) P.epoch = s.epoch || '';   // 別のタブで記録が消されたあと: 新しい記録として数える
        const old = s.daily[P.date];
        if (old && old.state === 'solved') {          // 別のタブで先に解決していた: 二重に数えず、その記録を見せる
          Object.assign(P, { mistakes: old.mistakes, hints: old.hints, attempts: old.attempts || '■', elapsed: old.elapsed, solvedOnDay: old.solvedOnDay });
          P.streakAtSolve = Number.isInteger(old.streak) ? old.streak : null;
          return;
        }
        const st = s.stats;
        st.totalSolved += 1;
        if (P.mistakes === 0) st.perfect += 1;
        // 基準は事件の日付（P.date）。最後に解いた日が少し先（時差で日付が戻ったとき）なら、連続も最後の日も巻き戻さない（addStreak）
        if (P.solvedOnDay) addStreak(st, P.date);
        if (P.solvedOnDay) P.streakAtSolve = st.streak;  // 結果とコピー文には、解いた時点の連続日数を使う
      });

      syncNotifications();   // 今日を解いたら、夜の「まだ解いていません」を取り消す
    } else {
      update((s) => {
        if ((s.epoch || '') !== (P.epoch || '')) P.epoch = s.epoch || '';

  function rankTitle() {
