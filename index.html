    [['時間', f.time], ['ミス', f.mistakes], ['ヒント', f.hints]].forEach((p, i) => {
      const x = 280 + i * 260;
      sText(ctx, p[0], x, 910, '700 24px ' + FB, SC.ink3, 'center', 4);
      sText(ctx, p[1], x, 972, '800 ' + fitSize(ctx, p[1], '800', 58, FD, 230, 30) + 'px ' + FD, SC.ink, 'center');
    });
    // 提出の記録（□□■）
    const n = Array.from(f.attempts).length, tryText = n + '回目で解決', tf = '500 30px ' + FB;
    const tw = sWidth(ctx, tryText, tf);
    const drawBox = (ch, x, box) => {
      if (ch === '■') { ctx.fillStyle = SC.shu; ctx.fillRect(x, 1058 - box, box, box); }
      else { ctx.strokeStyle = SC.ink2; ctx.lineWidth = 2.6; ctx.strokeRect(x + 1.3, 1058 - box + 1.3, box - 2.6, box - 2.6); }
    };
    if (n <= 24) {
      const box = n <= 12 ? 30 : 22, gp = n <= 12 ? 8 : 5, bw = n * box + (n - 1) * gp, total = bw + 18 + tw;
      let x = cx - total / 2;
      Array.from(f.attempts).forEach((ch) => { drawBox(ch, x, box); x += box + gp; });
      sText(ctx, tryText, x - gp + 18, 1056, tf, SC.ink2, 'left');
    } else {
      // 多いときは「□ ×n ■」（□ と ■ は四角で描く。■ は朱）
      const box = 30, mult = '×' + Array.from(f.attempts).filter((c) => c === '□').length, mf = '700 30px ' + FB;
      const mw = sWidth(ctx, mult, mf), total = box + 8 + mw + 10 + box + 18 + tw;
      let x = cx - total / 2;
      drawBox('□', x, box); x += box + 8;
      sText(ctx, mult, x, 1056, mf, SC.ink2, 'left'); x += mw + 10;
      if (f.attempts.indexOf('■') >= 0) drawBox('■', x, box);
      x += box + 18;
      sText(ctx, tryText, x, 1056, tf, SC.ink2, 'left');
    }
    // 連続日数
    const st = f.streak;
    if (st.text) {
      const sf = '700 30px ' + FB, w = sWidth(ctx, st.text, sf) + (st.lamp ? 46 : 0);
      if (st.lamp) LAMP_PATHS.forEach((d) => svgPath(ctx, d, cx - w / 2, 1087, 36 / 24, 'stroke', SC.shu, 2.6));
      sText(ctx, st.text, cx - w / 2 + (st.lamp ? 46 : 0), 1116, sf, SC.ink2, 'left');
    } else {
      const a = st.pre + ' ', b = String(st.n), c2 = ' ' + st.post;
      const fa = '700 30px ' + FB, fb = '800 46px ' + FD;
      const w = (st.lamp ? 46 : 0) + sWidth(ctx, a, fa) + sWidth(ctx, b, fb) + sWidth(ctx, c2, fa);
      let x = cx - w / 2;
      if (st.lamp) { LAMP_PATHS.forEach((d) => svgPath(ctx, d, x, 1085, 36 / 24, 'stroke', SC.shu, 2.6)); x += 46; }
      sText(ctx, a, x, 1116, fa, SC.ink2, 'left'); x += sWidth(ctx, a, fa);
      sText(ctx, b, x, 1118, fb, SC.ink, 'left'); x += sWidth(ctx, b, fb);
      sText(ctx, c2, x, 1116, fa, SC.ink2, 'left');
    }
    // アプリ名と URL
    ctx.strokeStyle = SC.rule; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(250, 1156); ctx.lineTo(830, 1156); ctx.stroke();
    sText(ctx, '嘘つき村の事件簿', cx, 1206, '800 40px ' + FD, SC.ink, 'center', 6);
    sText(ctx, SITE_URL, cx, 1246, '500 23px ' + FB, SC.ink2, 'center', 0.5);
  }

  // ［画像で共有］iOS アプリは Share・Filesystem、スマホのブラウザは Web Share（画像が送れるとき）。
  // PC（マウスで操作する端末）と、どちらも無理なときは画面内に大きく出す（PC の Web Share はそこの［共有…］から）
  const isCancel = (e) => !!e && (e.name === 'AbortError' || /cancel/i.test(String(e.message || e.errorMessage || e)));
  const finePointer = () => { try { return matchMedia('(pointer: fine)').matches && !matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } };
  function canShareFile(img) {
    if (!img || !img.file || !navigator.share || !navigator.canShare) return false;
    try { return !!navigator.canShare({ files: [img.file] }); } catch (e) { return false; }
  }
  async function webShare(img) {
    await navigator.share({ files: [img.file], title: '嘘つき村の事件簿', text: copyText() });
  }
  async function shareResult(btn) {
    if (!P || P.state !== 'solved') return;
    if (btn && btn.getAttribute('aria-busy') === 'true') return;
    const text = copyText(), p0 = P;
    // 画像を作っている間に結果を閉じた・別の事件を開いたときは、あとから共有の画面を出さない
    const stillHere = () => P === p0 && !$('#result').hidden;
    let img = shareCache && shareCache.p === P && shareCache.img;
    if (img && !shareFresh(img)) img = null;   // 書体が届く前に描いた画像は、書体が届いていれば描き直す
    if (!img) {
      const lab = btn && btn.querySelector('span');
      if (btn) btn.setAttribute('aria-busy', 'true'); if (lab) lab.textContent = '画像を作っています';
      try { img = await prepareShare(); } catch (e) { img = null; }
      if (btn) btn.removeAttribute('aria-busy'); if (lab) lab.textContent = '画像で共有';
      if (!stillHere()) return;
      if (!img) { toast('画像を作れませんでした'); return; }
    }
    const shN = plug('Share'), fsN = plug('Filesystem');
    if (shN && fsN) {
      try {
        const w = await fsN.writeFile({ path: img.name, data: img.dataURL.split(',')[1], directory: 'CACHE' });
        await shN.share({ title: '嘘つき村の事件簿', text, files: [w.uri], dialogTitle: '結果を共有' });
        return;
      } catch (e) { if (isCancel(e)) return; }
    } else if (!finePointer() && canShareFile(img)) {
      try { await webShare(img); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    if (stillHere()) openShareView(img);
  }

      '<div class="danger-zone">' +
      (confirmOpen
        ? '<div class="confirm" role="alertdialog" aria-labelledby="cfmText"><p id="cfmText">日替わりの記録・練習の途中・連続日数をすべて消します。元には戻せません。</p><div class="row"><button class="btn btn-danger" type="button" data-reset="yes">' + icon('i-trash') + '消す</button><button class="btn" type="button" data-reset="no">やめる</button></div></div>'
        : '<button class="btn" type="button" data-reset="ask">' + icon('i-trash') + '記録を消す</button>') +
      '</div>' +
      '<p class="about">記録や操作の内容を外部に送ることはありません（外から読むのは文字の書体だけで、Google Fonts から読み込みます）。記録はこの端末の' + (NATIVE ? 'アプリの中' : 'ブラウザの中（localStorage）') + 'だけに保存されます。<br>問題はすべてその場で自動で作られ、答えが1つに決まることを確かめています。<br>' +
      '<a class="about-link" href="https://kiyotake1229.github.io/usotsuki-mura/support.html" target="_blank" rel="noopener">' + icon('i-q') + 'サポート・プライバシーポリシー</a></p>';
  }

  /* ---------- 操作 ---------- */
  document.addEventListener('click', (e) => {
    const t = e.target;
    const nav = t.closest('[data-nav]');
    if (nav) {
      const v = nav.dataset.nav;
      // 見出しの戻るボタンは、ひとつ前の画面へ（ブラウザの戻ると同じ）
      if (nav.closest('.pagebar')) goBack();
      else go(v);
      return;
    }
    const pr = t.closest('[data-practice]');
    if (pr) { openPractice(pr.dataset.practice); return; }
    if (t.closest('#tOpen')) { openCase({ mode: 'daily', date: today(), from: 'home' }); return; }
    const pdb = t.closest('[data-pending]');
    if (pdb) { openCase({ mode: 'daily', date: pdb.dataset.pending, from: 'home' }); return; }
    const lg = t.closest('[data-date]');
    if (lg) { openCase({ mode: 'daily', date: lg.dataset.date, from: 'book' }); return; }

    // 事件の画面
    if (cur === 'play' && P) {
      const mk = t.closest('.mk');
      if (mk && P.ready) { onMark(+mk.dataset.i, mk.dataset.mk); return; }
      const nm = t.closest('.nm');
      if (nm) { focusCards([+nm.dataset.p]); return; }
      const rsb = t.closest('.rs');
      if (rsb) { focusCards([+rsb.dataset.ri]); return; }
      if (t.closest('#storyToggle')) {
        P.storyOpen = !P.storyOpen;
        $('#chStory').hidden = !P.storyOpen;
        const b = $('#storyToggle'); b.setAttribute('aria-expanded', String(P.storyOpen));
        b.innerHTML = (P.storyOpen ? 'あらましをたたむ' : 'あらましを読む') + icon('i-down');
        return;
      }
      if (t.closest('#btnHint')) { showHint(1); return; }
      if (t.closest('#btnSubmit')) { submit(); return; }
      if (t.closest('#btnExplain')) { renderExplain(); go('explain'); return; }
      if (t.closest('#btnResult')) { showResult(false); return; }
      if (t.closest('#btnNext')) { newPractice(P.slot); return; }
    }
    if (t.closest('#playBack')) { loadToken++; goBack(); return; }
    const ex = t.closest('[data-ex]');
    if (ex) {
      const a = ex.dataset.ex;
      if (a === 'back') goBack();
      else if (a === 'home') go('home');
      else if (a === 'next' && P) newPractice(P.slot);
      return;
    }
    const sh = t.closest('[data-sheet]');
    if (sh) { if (sh.dataset.sheet === 'hint2') showHint(2); else closeSheet(); return; }
    const res = t.closest('[data-res]');
    if (res) {
      if (performance.now() < resLockUntil) return;
      const a = res.dataset.res;
      if (a === 'copy') { doCopy($('#result')); return; }
      if (a === 'share') { shareResult(res); return; }
      hideResult();
      if (a === 'explain') { renderExplain(); go('explain'); }
      else if (a === 'next') newPractice(P.slot);
      else if (a === 'home') go('home');
      else { const f = $('#btnResult'); if (f) f.focus({ preventScroll: true }); }
      return;
    }
    const shv = t.closest('[data-share]');
    if (shv) {
      const a = shv.dataset.share;
      if (a === 'copy') doCopy($('#shareView'));
      else if (a === 'os') { if (shareImg) webShare(shareImg).catch((er) => { if (!(er && er.name === 'AbortError')) toast('共有できませんでした。画像を保存してから共有してください'); }); }
      else closeShareView();
      return;
    }
    if (t === $('#shareView')) { closeShareView(); return; }   // 画像の外側（暗いところ）を押したら閉じる
    if (t.closest('#exReveal')) {
      const box = $('#exSteps'), b = $('#exReveal');
      box.hidden = !box.hidden; b.setAttribute('aria-expanded', String(!box.hidden));
      b.innerHTML = icon('i-down') + (box.hidden ? '考え方と答えを見る' : '考え方と答えをかくす');
      return;
    }
    const set = t.closest('[data-set]');
    if (set) {
      const k = set.dataset.set;
      if (k === 'notifyMorning' || k === 'notifyEvening') { toggleNotify(k); return; }
      update((s) => { s.settings[k] = !s.settings[k]; });
      set.setAttribute('aria-checked', String(S.settings[k]));
      if (k === 'sound' && S.settings.sound) sfx('stamp');
      if (k === 'haptics' && S.settings.haptics) buzz('toggle');
      return;
    }
    const th = t.closest('[data-theme-set]');
    if (th) {
      const v = th.dataset.themeSet;
      update((s) => { s.settings.theme = v; });
      applyTheme(); renderSettings();
      const f = $('[data-theme-set="' + v + '"]'); if (f) f.focus();   // 作り直したあとも、押したボタンに焦点を残す
      return;
    }
    const rs = t.closest('[data-reset]');
    if (rs) {
      const a = rs.dataset.reset;
      if (a === 'ask') confirmOpen = true;
      else if (a === 'no') confirmOpen = false;
      else if (a === 'yes') {
        const keep = S.settings;
        S = defaults(); S.settings = keep;
        S.epoch = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);   // ほかのタブの事件が書き戻さないように
        persist();
        P = null; confirmOpen = false; lastPracticeTitle = null;
        navStack.length = 1; navStack.push('settings');
        Object.keys(titleCache).forEach((k) => delete titleCache[k]);
        toast('記録を消しました');
        syncNotifications();
      }
      renderSettings();
      if (a !== 'yes') { const f = $(a === 'ask' ? '[data-reset="no"]' : '[data-reset="ask"]'); if (f) f.focus(); }
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!$('#shareView').hidden) { closeShareView(); return; }
    if (!$('#result').hidden) { hideResult(); const f = $('#btnResult'); if (f) f.focus({ preventScroll: true }); return; }
    if (!$('#sheet').hidden) closeSheet();
  });
  // 登場・揺れ・判子の動きは終わったら外す（あとで光らせたときに登場の動きがやり直されないように）
  $('#playBody').addEventListener('animationend', (e) => {
    const el = e.target; if (!el || !el.classList) return;
    if (e.animationName === 'card-in') el.classList.remove('enter');
    else if (e.animationName === 'shake') el.classList.remove('shake');
    else if (e.animationName === 'stamp-small') el.classList.remove('stamp');
  });

  // 経過時間は画面が見えている間だけ進む
  let tick = 0, lastDay = today(), lastEarly = new Date().getHours() < 3;
  setInterval(() => {
    // 表示したまま日付が変わったとき・3時を過ぎたときは、ホームと事件簿の「今日」・連続・お知らせを描き直す
    // （ロック中・裏にある間・スリープ中はこのタイマーが止まるので、起きたときの最初の1回で、いまの時刻に合わせて判断する）
    const d = today(), early = new Date().getHours() < 3;
    if (d !== lastDay || early !== lastEarly) {
      lastDay = d; lastEarly = early;
      if (cur === 'home') renderHome(); else if (cur === 'book') renderBook();
      // 開いた日の事件を解いている途中で、日付が変わった・3時を過ぎた: 連続日数に数えるかを知らせる
      else if (cur === 'play' && P && P.ready && P.mode === 'daily' && P.state !== 'solved' && P.openedOnDay && P.date < d) {
        if (countsOnDay(P.date, true, d, new Date().getHours())) toast('日付が変わりました。3時までに解けば、連続日数に数えます');
        else toast('翌朝3時を過ぎたので、この事件は連続日数に数えません');
      }
    }
    if (cur !== 'play' || !P || !P.ready) return;
    $('#tbClock').textContent = fmtTime(elapsedNow());
    if (T.running && ++tick % 20 === 0) saveProgress();
  }, 500);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { timerStop(); saveProgress(); }
    else {
      if (cur === 'play') timerStart();
      if (cur === 'home') renderHome();
    }
  });
  window.addEventListener('pagehide', () => { timerStop(); saveProgress(); });
  // 別のタブで記録が変わったら読み直す
  window.addEventListener('storage', (e) => {
    if (e.key !== KEY && e.key !== null) return;
    const fresh = readStore(); if (!fresh) return;
    const wiped = (fresh.epoch || '') !== (S.epoch || '');   // 別のタブで「記録を消す」をした
    S = fresh;
    applyTheme();
    if (wiped) {
      // 開いている事件は消す前のものなので閉じる（書き戻さない）。事件・解説の画面にいたらホームへ
      timerStop(); loadToken++; cancelHeavy(); progStop(); closeSheet(); hideResult();
      P = null; lastPracticeTitle = null;
      Object.keys(titleCache).forEach((k) => delete titleCache[k]);
      if (cur === 'play' || cur === 'explain') go('home');
      toast('別の画面で記録が消されました');
    }
    if (cur === 'home') renderHome(); else if (cur === 'book') renderBook(); else if (cur === 'settings') renderSettings();
  });

  /* ---------- 通知（iOS アプリの LocalNotifications。端末の中だけで予約する） ----------
     毎朝: 指定の時刻に「今日の事件が届きました」。その日の No.・事件名を入れて、先28日分を1日ずつ予約する
     夜:   20:00 に「まだ解いていません」。その日が未解決のときだけ（先7日分。解いたら取り消す）
     起動・アプリに戻ったとき・設定を変えたとき・今日を解いたときに、まとめて予約し直す */
  const NOTI_M = 710000, NOTI_E = 720000;   // 通知の番号 = 基準 + 事件の No.
  const NOTI_DAYS_M = 28, NOTI_DAYS_E = 7, EVENING_AT = [20, 0];
  let notiDenied = false, notiChain = Promise.resolve();
  const isMine = (id) => Number.isInteger(id) && ((id >= NOTI_M && id < NOTI_M + 10000) || (id >= NOTI_E && id < NOTI_E + 10000));
  function syncNotifications() {
    const ln = plug('LocalNotifications'); if (!ln) return Promise.resolve();
    notiChain = notiChain.then(() => syncNow(ln), () => syncNow(ln));
    return notiChain;
  }
  async function syncNow(ln) {
    try {
      // まず、このアプリが前に予約した分をすべて取り消す
      let ids = [];
      try {
        const pend = await ln.getPending();
        ids = ((pend && pend.notifications) || []).map((n) => Number(n.id)).filter(isMine);
      } catch (e) {
        const no = Engine.dailyConfig(today()).no;
        for (let k = -3; k <= NOTI_DAYS_M + 3; k++) { if (no + k > 0) ids.push(NOTI_M + no + k, NOTI_E + no + k); }
      }
      if (ids.length) await ln.cancel({ notifications: ids.map((id) => ({ id })) });
      const st = S.settings, was = notiDenied;
      let perm = null; try { perm = await ln.checkPermissions(); } catch (e) { perm = null; }
      const granted = !!perm && perm.display === 'granted';
      // 「許可されていません」の注記: 許可されたら消す（iPhone の設定で許可して戻ってきたときなど）。
      // まだ一度も求めていない（両方 OFF）ときは出さない。ON なのに許可が無いときだけ出す
      if (granted) notiDenied = false;
      else if (st.notifyMorning || st.notifyEvening) notiDenied = true;
      if (was !== notiDenied && cur === 'settings') renderSettings();
      if (!st.notifyMorning && !st.notifyEvening) return;
      if (!granted) return;
      const t = today(), now = Date.now(), hm = st.notifyTime.split(':').map(Number), list = [];
      for (let i = 0; i < NOTI_DAYS_M; i++) {
        const d = Engine.addDays(t, i), cfg = Engine.dailyConfig(d);
        if (!(cfg.no >= 1) || cfg.no >= 10000) continue;
        const p = parseD(d), what = 'No.' + cfg.no + '「' + (cfg.title || '今日の事件') + '」';
        if (st.notifyMorning) {
          const at = new Date(p.y, p.m - 1, p.d, hm[0], hm[1], 0);
          if (at.getTime() > now + 5000) list.push({ id: NOTI_M + cfg.no, title: '今日の事件が届きました', body: what + '（' + starsText(cfg.star) + '・容疑者' + cfg.people + '人）。犯人は1人だけ。', schedule: { at, allowWhileIdle: true }, extra: { date: d } });
        }
        const rec = S.daily[d];
        if (st.notifyEvening && i < NOTI_DAYS_E && !(rec && rec.state === 'solved')) {
          const at = new Date(p.y, p.m - 1, p.d, EVENING_AT[0], EVENING_AT[1], 0);
          if (at.getTime() > now + 5000) list.push({ id: NOTI_E + cfg.no, title: 'まだ解いていません', body: '今日の事件 ' + what + 'が、あなたの推理を待っています。', schedule: { at, allowWhileIdle: true }, extra: { date: d } });
        }
      }
      if (list.length) await ln.schedule({ notifications: list });
    } catch (e) { /* 予約できなくても遊べる */ }
  }
  // ON にしたときだけ許可を求める。許可されなければ OFF に戻す
  async function toggleNotify(k) {
    const on = !S.settings[k];
    const ln = plug('LocalNotifications');
    if (on && ln) {
      let ok = false;
      try {
        let p = await ln.checkPermissions();
        if (!p || p.display !== 'granted') p = await ln.requestPermissions();
        ok = !!p && p.display === 'granted';
      } catch (e) { ok = false; }
      notiDenied = !ok;
      if (!ok) { renderSettings(); toast('通知が許可されていません'); const f = $('[data-set="' + k + '"]'); if (f) f.focus(); return; }
    }
    update((s) => { s.settings[k] = on; });
    if (cur === 'settings') { renderSettings(); const f = $('[data-set="' + k + '"]'); if (f) f.focus(); }
    syncNotifications();
  }
  document.addEventListener('change', (e) => {
    if (e.target && e.target.id === 'notifyTime') {
      const v = e.target.value;
      if (!TIME_RE.test(v)) { e.target.value = S.settings.notifyTime; return; }
      update((s) => { s.settings.notifyTime = v; });
      syncNotifications();
      toast('毎朝 ' + v + ' に知らせます');
    }
  });
  // 通知を押してアプリを開いたら、今日の事件を開く（起動前に届いたものは起動後に）
  let booted = false, pendingOpen = false;
  function openFromNotice() {
    if (!booted) { pendingOpen = true; return; }
    if (cur === 'play' && P && P.mode === 'daily' && P.date === today()) return;
    openCase({ mode: 'daily', date: today(), from: 'home' });
  }
  if (plug('LocalNotifications') && plug('LocalNotifications').addListener) {
    try { quiet(plug('LocalNotifications').addListener('localNotificationActionPerformed', (a) => { const id = a && a.notification && Number(a.notification.id); if (isMine(id)) openFromNotice(); })); } catch (e) { /* 無くてもよい */ }
  }
  // アプリが裏に回ったら経過時間を止めて保存。戻ったら再開し、日付が変わっていれば描き直して通知を予約し直す
  if (plug('App') && plug('App').addListener) {
    try {
      quiet(plug('App').addListener('appStateChange', (st) => {
        if (st && st.isActive === false) { timerStop(); saveProgress(); return; }
        if (cur === 'play') timerStart();
        if (cur === 'home') renderHome(); else if (cur === 'book') renderBook();
        applyTheme();   // 状態バーの文字色をテーマに合わせ直す
        syncNotifications();
      }));
    } catch (e) { /* 無ければ visibilitychange だけで止める */ }
  }

  /* ---------- オフライン（Service Worker） ---------- */
  // GitHub Pages などで直接開いたときだけ登録する。登録しないのは:
  //   iOS アプリの中（NATIVE）／Claude Artifact のような iframe・sandbox の中／http(s) 以外／
  //   安全でない接続（https でも localhost でもない）／Service Worker の無いブラウザ
  // 登録に失敗しても何もしない（アプリはそのまま動く）
  function registerSW() {
    try {
      if (NATIVE) return;
      if (!/^https?:$/.test(location.protocol) || !window.isSecureContext) return;
      if (window.self !== window.top || window.origin === 'null') return;
      if (!('serviceWorker' in navigator)) return;
      const go = () => {
        try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) { /* 何もしない */ }
      };
      if (document.readyState === 'complete') go();
      else window.addEventListener('load', go, { once: true });
    } catch (e) { /* 何もしない */ }
  }

  /* ---------- 起動 ---------- */
  function boot() {
    if (booted) return;
    booted = true;
    applyTheme();
    show('home');
    if (NATIVE) syncNotifications();
    // iOS アプリ: 画面が出た直後に StatusBar が既定の色に戻すことがあるので、少し後にもう一度テーマを当てる
    if (plug('StatusBar')) setTimeout(applyTheme, 900);
    if (pendingOpen) { pendingOpen = false; openFromNotice(); }
    registerSW(); // オフライン用（ネイティブ・Artifact では何もしない）
  }
  if (plug('Preferences')) {
    // iOS アプリ: Preferences から記録を戻してから始める（長くても1.2秒で始める）
    const t0 = setTimeout(boot, 1200);
    nativeRestore().then((changed) => {
      clearTimeout(t0);
      if (!booted) { boot(); return; }
      if (changed) { applyTheme(); if (cur === 'home') renderHome(); else if (cur === 'book') renderBook(); else if (cur === 'settings') renderSettings(); syncNotifications(); }
    }, () => { clearTimeout(t0); boot(); });
  } else boot();
})();
</script>
</body>
